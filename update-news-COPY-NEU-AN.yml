name: Cap nhat tin 4 NXB

on:
  schedule:
    # Chay 4 lan/ngay theo gio Viet Nam: 07:30, 11:30, 16:30, 20:30
    - cron: "30 0,4,9,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          HOUR_UTC=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR_UTC" = "04" ] || [ "$HOUR_UTC" = "13" ]; then
            export RUN_SOCIAL="true"
          else
            export RUN_SOCIAL="false"
          fi
          python scraper.py

      - name: Commit & Push news.json
        run: |
          git config user.name "TuSach Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "update news $(date -u +'%Y-%m-%d %H:%M')" && git push)
