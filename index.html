      // ============================
      // TAB 3: TIN NXB (Mặc định CHỈ lọc theo tủ sách + chặn tin rác)
      // ============================
      const CLIENT_SPAM_KEYWORDS = [
        "ipmate",
        "ma giam gia",
        "voucher shopee",
        "voucher lazada",
        "black friday",
        "flash sale",
        "mega live",
        "tiktok shop",
        "creator tren tiktok",
        "group danh rieng cho cac creator",
        "tuyen dung",
        "thong bao nghi le",
        "bao tri he thong",
        "minigame",
        "giveaway",
      ];

      function isJunkNewsItem(item) {
        if (!item || item.manual) return false;
        const hay = normVN(`${item.title || ""} ${item.summary || ""}`);
        return CLIENT_SPAM_KEYWORDS.some((kw) => hay.includes(kw));
      }

      function extractSeriesKeywords(seriesObj) {
        const rawParts = [];
        if (seriesObj.title) {
          rawParts.push(seriesObj.title);
          // Tách tên Việt / Anh / phụ đề qua dấu —, –, -, :, /, ngoặc
          seriesObj.title.split(/[—–\-:\/()|]+/).forEach((p) => rawParts.push(p));
        }
        if (seriesObj.aliases) {
          seriesObj.aliases.split(/[,;|]+/).forEach((p) => rawParts.push(p));
        }

        const tokens = new Set();
        for (const part of rawParts) {
          let t = normVN(part);
          if (!t) continue;
          // Bỏ các hậu tố tập/phần/phiên bản để khớp rộng hơn
          t = t
            .replace(/\b(phan|tap|vol|volume|season|quyen|bo|boxset|ban dac biet|ban db|limited|tai ban)\s*\d*\b/g, "")
            .replace(/\s+/g, " ")
            .trim();
          if (t.length >= 3) tokens.add(t);
        }
        return [...tokens];
      }

      function findMatchedSeries(item) {
        if (!state.series.length) return null;
        const hay = normVN(
          `${item.title || ""} ${item.series || ""} ${item.summary || ""} ${item.gift || ""} ${item.searchText || ""}`
        );
        if (!hay) return null;
        const paddedHay = ` ${hay} `;

        for (const s of state.series) {
          const keywords = extractSeriesKeywords(s);
          for (const kw of keywords) {
            if (kw.length <= 4) {
              // Từ khoá ngắn (VD: jojo, orv, opm) bắt buộc khớp nguyên từ để tránh trùng nhầm
              if (paddedHay.includes(` ${kw} `)) return s;
            } else {
              if (hay.includes(kw)) return s;
            }
          }
        }
        return null;
      }

      function matchesUserShelf(item) {
        return Boolean(findMatchedSeries(item));
      }

      async function fetchNews(manual = false) {
        const titleEl = document.getElementById("newsSyncTitle");
        const metaEl = document.getElementById("newsSyncMeta");
        const srcUrl = state.newsUrl || "./news.json";
        titleEl.textContent = "Đang tải tin 4 NXB...";
        metaEl.textContent = `Nguồn: ${srcUrl}`;

        try {
          const sep = srcUrl.includes("?") ? "&" : "?";
          const res = await fetch(`${srcUrl}${sep}t=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const rawList = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [];
          // Lọc sạch tin rác ngay phía client (phòng trường hợp news.json cũ còn sót)
          newsItems = rawList.filter((it) => !isJunkNewsItem(it));
          newsMeta = {
            updatedAt: data.updatedAt || "",
            loaded: true,
            error: "",
          };
          const timeStr = newsMeta.updatedAt
            ? new Date(newsMeta.updatedAt).toLocaleString("vi-VN", { hour12: false })
            : "Vừa xong";
          metaEl.textContent = `Cập nhật: ${timeStr}`;
          if (manual) showToast("Đã cập nhật dữ liệu tin 4 NXB.");
        } catch (err) {
          newsMeta = { updatedAt: "", loaded: false, error: err.message };
          titleEl.textContent = "Chưa kết nối được file tin";
          metaEl.textContent =
            location.protocol === "file:"
              ? "Đang mở file offline — đẩy lên GitHub Pages để bot tự cập nhật."
              : `Lỗi tải ${srcUrl} (${err.message})`;
          if (manual) showToast("Chưa tải được news.json.");
        }
        renderNews();
      }

      function countdownText(dateStr) {
        if (!dateStr) return "";
        const target = new Date(dateStr + "T00:00:00");
        if (isNaN(target.getTime())) return dateStr;
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diff = Math.round((target - now) / 86400000);
        if (diff > 0) return `${dateStr} (còn ${diff} ngày)`;
        if (diff === 0) return `${dateStr} (hôm nay)`;
        return dateStr;
      }

      function renderNews() {
        const container = document.getElementById("newsContainer");
        const titleEl = document.getElementById("newsSyncTitle");

        const manualPins = state.pinned
          .filter((p) => p.manual)
          .map((p) => ({
            id: p.id,
            publisher: p.publisher,
            type: p.type,
            channel: p.channel || "Ghim tay",
            title: p.title,
            series: p.series || "",
            summary: p.note || "",
            gift: p.gift || "",
            releaseDate: p.releaseDate || "",
            price: p.estPrice || 0,
            url: p.url || "",
            image: "",
            manual: true,
          }));

        const combined = [...manualPins, ...newsItems];
        const shelfMatchedList = combined.filter((it) => it.manual || matchesUserShelf(it));

        // Cập nhật số đếm trên 2 tab chuyển chế độ + chấm thông báo đỏ CHỈ khi có tin khớp tủ
        const shelfCountEl = document.getElementById("scopeShelfCount");
        const allCountEl = document.getElementById("scopeAllCount");
        if (shelfCountEl) shelfCountEl.textContent = `(${shelfMatchedList.length})`;
        if (allCountEl) allCountEl.textContent = `(${combined.length})`;

        const autoShelfMatchedCount = newsItems.filter((it) => matchesUserShelf(it)).length;
        document.getElementById("newsDot").classList.toggle("show", autoShelfMatchedCount > 0);

        if (newsMeta.loaded) {
          titleEl.textContent = state.series.length
            ? `${autoShelfMatchedCount} tin khớp tủ · ${newsItems.length} tin sạch từ 4 NXB`
            : `Chưa có sách trong tủ · Đã quét ${newsItems.length} tin 4 NXB`;
        }

        const baseList = filters.newsScope === "shelf" ? shelfMatchedList : combined;

        const filtered = baseList.filter((it) => {
          if (filters.newsPub !== "Tất cả" && it.publisher !== filters.newsPub) return false;
          if (filters.newsType !== "Tất cả" && it.type !== filters.newsType) return false;
          if (filters.newsChan !== "Tất cả" && it.channel !== filters.newsChan) return false;

        if (!filtered.length) {
          if (filters.newsScope === "shelf" && !state.series.length) {
            container.innerHTML = `
              <div class="empty">
                <div class="empty-title">Tủ sách đang trống</div>
                <div class="empty-desc">
                  Tab này mặc định chỉ hiện tin tập mới, tái bản, quà kèm và Fes liên quan đến <strong>truyện & sách bạn đang có</strong>. Thêm sách vào tủ trước để app tự lọc tin cho bạn.
                </div>
                <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                  <button class="btn btn-sm btn-primary" id="emptyGoAddBook">+ Thêm bộ vào tủ</button>

              document.querySelector('.tab-btn[data-tab="books"]').click();
              openSeriesForm();
            });
            container.querySelector("#emptySwitchAll").addEventListener("click", () => {
              document.getElementById("scopeAllBtn").click();
            });
            return;
          }

          if (filters.newsScope === "shelf" && state.series.length) {
            container.innerHTML = `
              <div class="empty">
                <div class="empty-title">Chưa có tin mới liên quan tới tủ của bạn</div>
                <div class="empty-desc">
                  Hiện chưa có bài mới nào từ Trẻ, Kim Đồng, IPM, Nhã Nam nhắc tới ${state.series.length} đầu sách trong tủ. Mẹo: vào sửa bộ sách và điền thêm <strong>Tên khác / từ khoá</strong> (VD: tên tiếng Anh/Nhật) nếu NXB hay dùng tên khác.
                </div>
                <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                  <button class="btn btn-sm" id="emptySwitchAll2">Xem tất cả tin 4 NXB</button>
                  <button class="btn btn-sm" id="emptyManualPin">+ Tự ghim lịch săn</button>
                </div>
              </div>`;
            container.querySelector("#emptySwitchAll2").addEventListener("click", () => {
              document.getElementById("scopeAllBtn").click();
            });
            container.querySelector("#emptyManualPin").addEventListener("click", openManualPinForm);
            return;
          }

          container.innerHTML = `
            <div class="empty">
              <div class="empty-title">${combined.length ? "Không có tin khớp bộ lọc" : "Chưa có tin từ 4 NXB"}</div>
              <div class="empty-desc">${
                combined.length
                  ? "Thử chọn lại NXB, loại tin hoặc kênh khác."
                  : "Vào tab Actions trên GitHub bấm Run workflow để bot kéo tin mới từ 4 NXB."
              }</div>
              <button class="btn btn-sm" id="emptyManualPin">+ Tự ghim lịch săn</button>
            </div>`;
          const btn = document.getElementById("emptyManualPin");
          if (btn) btn.addEventListener("click", openManualPinForm);
          return;
        }

        const pinnedIds = new Set(state.pinned.map((p) => p.id));

        container.innerHTML = `<div class="news-list">${filtered
          .map((it) => {
            const matchedSeries = findMatchedSeries(it);
            const isPinned = pinnedIds.has(it.id);
            const cd = countdownText(it.releaseDate);
            return `
              <article class="news-card ${matchedSeries ? "matched" : ""}">
                <div class="news-head">
                  <span class="tag" style="border-left:2px solid ${pubColorVar(it.publisher)}">${esc(it.publisher)}</span>
                  <span class="tag ${typeTagClass(it.type)}">${typeLabel(it.type)}</span>
                  <span class="tag mono">${esc(it.channel || "Web")}</span>
                  ${matchedSeries ? `<span class="tag tag-accent">Khớp: ${esc(matchedSeries.title.slice(0, 26))}</span>` : ""}
                  ${cd ? `<span class="small-muted mono" style="margin-left:auto;">${esc(cd)}</span>` : ""}
                </div>
                <div class="news-body">
                  <div class="news-text">
                    <h3 class="news-title">${esc(it.title)}</h3>
                    ${it.summary ? `<p class="news-summary">${esc(it.summary)}</p>` : ""}
                    ${it.price ? `<div class="mono small-muted" style="margin-top:5px;">Giá dự kiến: ${fmtMoney(it.price)}</div>` : ""}
                  </div>
                  ${it.image ? `<img class="news-thumb" src="${esc(it.image)}" alt="" loading="lazy" onerror="this.style.display='none'" />` : ""}
                </div>
                ${it.gift ? `<div class="news-gift"><strong>Quà / Kèm:</strong> ${esc(it.gift)}</div>` : ""}
                <div class="news-actions">
                  <button class="btn btn-sm ${isPinned ? "btn-accent" : ""}" data-pin="${esc(it.id)}">
                    ${isPinned ? "Đã ghim dự chi" : "Ghim dự chi"}
                  </button>
                  <button class="btn btn-sm" data-import-news="${esc(it.id)}">Đã mua → Vào tủ</button>
                  ${
                    it.url
                      ? `<a class="btn btn-sm" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" style="margin-left:auto;">Xem gốc</a>`
                      : ""
                  }
                </div>
              </article>`;
          })
          .join("")}</div>`;

        container.querySelectorAll("[data-pin]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.pin;
            const existing = state.pinned.find((p) => p.id === id);
            if (existing) {
              state.pinned = state.pinned.filter((p) => p.id !== id);
              saveState();
              renderNews();
              renderSpending();
              showToast("Đã bỏ ghim.");
              return;
            }
            const item = combined.find((x) => x.id === id);
            if (!item) return;
            state.pinned.unshift({
              id: item.id,
              title: item.title,
              publisher: item.publisher,
              type: item.type,
              channel: item.channel,
              releaseDate: item.releaseDate || "",
              estPrice: Number(item.price) || 0,
              gift: item.gift || "",
              url: item.url || "",
              manual: false,
            });
            saveState();
            renderNews();
            renderSpending();
            showToast("Đã ghim vào Dự chi.");
          });
        });

        container.querySelectorAll("[data-import-news]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const item = combined.find((x) => x.id === btn.dataset.importNews);
            if (item) openQuickImportFromNews(item);
          });
        });
      }

        openModal("Đã mua → Nhập kho nhanh", html, (body) => {
          const targetSel = body.querySelector("#qiTarget");
          const bookExtra = body.querySelector("#qiBookExtra");
          const giftNameWrap = body.querySelector("#qiGiftNameWrap");
          const nameLabel = body.querySelector("#qiNameLabel");

          const toggleExtra = () => {
            const isBook = targetSel.value === "book";
            bookExtra.style.display = isBook ? "grid" : "none";
            giftNameWrap.style.display = isBook ? "none" : "";
            nameLabel.textContent = isBook ? "Tên bộ truyện / sách *" : "Thuộc truyện / sách có quà *";

          toggleExtra();

          const qiPaid = body.querySelector("#qiPaidIn");
          body.querySelectorAll("#qiCkRow .ck-btn").forEach((b) => {
            b.addEventListener("click", () => {
              const pct = Number(b.dataset.qck);
              const cp = Math.max(0, Number(qiCover.value) || 0);
              qiPaid.value = Math.round(cp * (1 - pct / 100));
            });
          });
                    body.querySelector("#qiCancel").addEventListener("click", closeModal);
          body.querySelector("#quickImportForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const name = fd.get("name").trim();
            const coverPrice = Math.max(0, Number(fd.get("coverPrice")) || 0);
            const paidPrice = Math.max(0, Number(fd.get("paidPrice")) || 0);

            if (fd.get("target") === "book") {
              let existing = state.series.find((s) => normVN(s.title) === normVN(name));
              if (!existing) {
                existing = {
                  id: uid(),
                  title: name,
                  publisher: item.publisher || "Khác",
                  category: "Manga",
                  status: "Đang theo",
                  aliases: "",
                  note: "",
                  cover: "",
                  sections: [],
                  createdAt: todayISO(),

                state.series.unshift(existing);

              const secName = (fd.get("sectionName") || "Bản thường").trim();

                sec = { id: uid(), name: secName, image: "", note: "", volumes: [] };

              }
              const f = Number(fd.get("volFrom")) || 1;
              const rawTo = (fd.get("volTo") || "").trim();
              if (rawTo && Number(rawTo) > f) {
                addBatchVolumesToSection(sec, {
                  from: f,
                  to: Number(rawTo),
                  priceMode: "total",
                  coverInput: coverPrice,
                  paidInput: paidPrice,
                  discount: 0,
                  date: todayISO(),
                  image: "",
                  note: item.gift ? `Quà: ${item.gift}` : "",
                });
              } else {
                sec.volumes.push({
                  id: uid(),
                  number: f,
                  coverPrice,
                  paidPrice,
                  date: todayISO(),
                  image: "",
                  note: item.gift ? `Quà: ${item.gift}` : "",
                });
              }
              showToast(`Đã nhập "${name}" (${secName}) vào Tủ sách.`);
            } else {
              let group = state.giftGroups.find((g) => normVN(g.title) === normVN(name));
              if (!group) {
                const matchedS = state.series.find((s) => normVN(s.title) === normVN(name));
                group = {
                  id: uid(),
                  title: name,
                  publisher: item.publisher || matchedS?.publisher || "Khác",
                  cover: matchedS?.cover || "",
                  note: "",
                  createdAt: todayISO(),
                  gifts: [],
                };
                state.giftGroups.unshift(group);
              }
              const gName = (fd.get("giftName") || item.gift || item.title).trim();
              group.gifts.unshift({
                id: uid(),
                name: gName,
                quantity: 1,
                price: paidPrice,
                source: item.type === "fes" ? "Săn tại Fes" : "Kèm bản ĐB",
                status: "Đã có",
                date: todayISO(),
                image: "",
                note: "",
              });
              showToast(`Đã nhập quà "${gName}" vào "${name}".`);
            }
            state.pinned = state.pinned.filter((p) => p.id !== item.id);
            saveState();
            renderBooks();
            renderMerch();
            renderNews();
            renderSpending();
            closeModal();
          });
        });
      }

      // ============================
      // TAB 4: CHI TIÊU
      // ============================
      function renderSpending() {
        let bookPaid = 0;
        let bookCover = 0;
        let merchPaid = 0;
        const pubTotals = { Trẻ: 0, "Kim Đồng": 0, IPM: 0, "Nhã Nam": 0, Khác: 0 };
        const catTotals = { Manga: 0, "Light Novel": 0, Sách: 0, Artbook: 0, "Quà & Đồ": 0 };
        const monthTotals = {};

        const now = new Date();
        const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const last6Months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          last6Months.push(ym);
          monthTotals[ym] = 0;
        }

        state.series.forEach((s) => {
          const pubKey = pubTotals.hasOwnProperty(s.publisher) ? s.publisher : "Khác";
          const catKey = catTotals.hasOwnProperty(s.category) ? s.category : "Sách";
          getAllSeriesVolumes(s).forEach((v) => {
            const p = Number(v.paidPrice) || 0;
            const c = Number(v.coverPrice) || 0;
            bookPaid += p;
            bookCover += c;
            pubTotals[pubKey] += p;
            catTotals[catKey] += p;
            const ym = (v.date || "").slice(0, 7);
            if (monthTotals.hasOwnProperty(ym)) monthTotals[ym] += p;
          });
        });

        state.giftGroups.forEach((g) => {
          const pubKey = pubTotals.hasOwnProperty(g.publisher) ? g.publisher : "Khác";
          (g.gifts || []).forEach((m) => {
            const p = Number(m.price) || 0;
            merchPaid += p;
            pubTotals[pubKey] += p;
            catTotals["Quà & Đồ"] += p;
            const ym = (m.date || "").slice(0, 7);
            if (monthTotals.hasOwnProperty(ym)) monthTotals[ym] += p;
          });
        });

        const totalPaid = bookPaid + merchPaid;
        const savedDiff = bookCover - bookPaid;
        const pinnedTotal = state.pinned.reduce((a, p) => a + (Number(p.estPrice) || 0), 0);

        document.getElementById("spendingKpis").innerHTML = `
          <div class="kpi-card">
            <div class="kpi-label">Tổng thực chi</div>
            <div class="kpi-val mono">${fmtMoney(totalPaid)}</div>
            <div class="kpi-sub">Sách ${fmtMoney(bookPaid)} · Quà ${fmtMoney(merchPaid)}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Tổng giá bìa</div>
            <div class="kpi-val mono">${fmtMoney(bookCover)}</div>
            <div class="kpi-sub">Chỉ tính sách & truyện</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">${savedDiff >= 0 ? "Tiết kiệm sale" : "Chênh mua hiếm"}</div>
            <div class="kpi-val mono" style="color:${savedDiff >= 0 ? "var(--forest)" : "var(--accent)"}">
              ${savedDiff >= 0 ? "-" : "+"}${fmtMoney(Math.abs(savedDiff))}
            </div>
            <div class="kpi-sub">So với giá bìa</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Dự chi đang ghim</div>
            <div class="kpi-val mono">${fmtMoney(pinnedTotal)}</div>
            <div class="kpi-sub">${state.pinned.length} mục chờ săn</div>
          </div>`;

        // Budget month
        const thisMonthSpent = monthTotals[currentYM] || 0;
        const limit = Number(state.budgetLimit) || 1000000;
        const pct = Math.min(100, Math.round((thisMonthSpent / Math.max(1, limit)) * 100));
        document.getElementById("budgetMonthTitle").textContent = `Hạn mức tháng ${currentYM.slice(5)}/${currentYM.slice(0, 4)}`;
        document.getElementById("budgetSpentText").textContent = fmtMoney(thisMonthSpent);
        document.getElementById("budgetLimitText").textContent = `/ ${fmtMoney(limit)}`;
        const bar = document.getElementById("budgetBar");
        bar.style.width = `${pct}%`;
        bar.classList.toggle("over", thisMonthSpent > limit);
        document.getElementById("budgetNote").textContent =
          thisMonthSpent > limit
            ? `Đã vượt hạn mức tháng ${fmtMoney(thisMonthSpent - limit)}.`
            : `Còn dư ${fmtMoney(limit - thisMonthSpent)} trong tháng này (${pct}%).`;

        // Helper for flat bar lists
        function renderBars(elId, entries) {
          const max = Math.max(...entries.map(([, v]) => v), 1);
          document.getElementById(elId).innerHTML = entries
            .map(
              ([label, val]) => `
            <div class="bar-row">
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(label)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.round((val / max) * 100)}%"></div></div>
              <span class="bar-val mono">${fmtMoney(val)}</span>
            </div>`
            )
            .join("");
        }

        renderBars(
          "chartMonths",
          last6Months.map((ym) => [`T${ym.slice(5)}/${ym.slice(2, 4)}`, monthTotals[ym]])
        );
        renderBars("chartPublishers", Object.entries(pubTotals));
        renderBars("chartCategories", Object.entries(catTotals));

        // Pinned watchlist
        document.getElementById("pinnedTotalLabel").textContent = fmtMoney(pinnedTotal);
        const pinContainer = document.getElementById("pinnedListContainer");
        if (!state.pinned.length) {
          pinContainer.innerHTML = `<div class="small-muted">Chưa ghim mục nào. Vào tab Tin NXB bấm "Ghim dự chi" để theo dõi.</div>`;
        } else {
          pinContainer.innerHTML = state.pinned
            .map(
              (p) => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);">
              <div style="min-width:0;">
                <div style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(p.title)}</div>
                <div class="small-muted mono">${esc(p.publisher)} ${p.releaseDate ? `· ${esc(p.releaseDate)}` : ""}</div>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                <button class="btn btn-sm mono" data-edit-pin-price="${esc(p.id)}">${fmtMoney(p.estPrice)}</button>
                <button class="btn btn-sm" data-unpin="${esc(p.id)}">Bỏ</button>
              </div>
            </div>`
            )
            .join("");

          pinContainer.querySelectorAll("[data-edit-pin-price]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const p = state.pinned.find((x) => x.id === btn.dataset.editPinPrice);
              if (!p) return;
              const val = prompt(`Nhập số tiền dự chi (VNĐ) cho "${p.title}":`, String(p.estPrice || 0));
              if (val === null) return;
              p.estPrice = Math.max(0, Number(val.replace(/[^\d]/g, "")) || 0);
              saveState();
              renderSpending();
            });
          });
          pinContainer.querySelectorAll("[data-unpin]").forEach((btn) => {
            btn.addEventListener("click", () => {
              state.pinned = state.pinned.filter((x) => x.id !== btn.dataset.unpin);
              saveState();
              renderNews();
              renderSpending();
            });
          });
        }
      }

      // ============================

      // ============================
      function openSettingsModal() {
        const html = `
          <div class="form-grid">
            <div class="field">
              <label>Nguồn tin tự động (JSON URL)</label>
              <input id="setNewsUrl" value="${esc(state.newsUrl || "./news.json")}" />
              <div class="small-muted" style="margin-top:4px;">Mặc định là <code>./news.json</code> khi chạy trên GitHub Pages.</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-sm btn-primary" id="saveNewsUrlBtn">Lưu & Tải lại tin</button>
              <button class="btn btn-sm" id="resetNewsUrlBtn">Về mặc định</button>
            </div>

            <div class="divider"></div>
            <div class="panel-title">Bộ nhớ & Sao lưu iPhone</div>
            <div class="boxset-hint mono" id="storageHealthBox">Đang kiểm tra dung lượng...</div>
            <div class="small-muted">Dữ liệu đã được lưu trên <strong>IndexedDB</strong> (dung lượng lớn, chống tràn 5MB của Safari) và tự chống trùng lặp ảnh. Nên xuất 1 file sao lưu vào iCloud Drive mỗi tháng.</div>
            <div class="small-muted mono" id="lastBackupMeta"></div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <button class="btn btn-sm btn-primary" id="exportJsonBtn">Lưu iCloud / Xuất .json</button>
              <button class="btn btn-sm" id="importJsonBtn">Nhập file sao lưu (.json)</button>
              <button class="btn btn-sm" id="recoverShadowBtn">Khôi phục bản chữ khẩn cấp</button>
            </div>

            <div class="divider"></div>
            <div class="panel-title">Thử nhanh & Dọn dẹp</div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <button class="btn btn-sm" id="loadSampleBtn">Nạp 3 bộ mẫu test</button>
              <button class="btn btn-sm btn-danger" id="wipeAllBtn">Xoá toàn bộ dữ liệu</button>
            </div>
          </div>`;

        openModal("Cài đặt & Sao lưu", html, (body) => {
          const healthEl = body.querySelector("#storageHealthBox");
          if (healthEl) {
            const bytes = estimateStateBytes(state);
            const mb = (bytes / (1024 * 1024)).toFixed(2);
            const imgCount = Object.keys(state.images || {}).length;
            healthEl.textContent = `Kho lưu: ${storageEngine} · Đang dùng ${mb} MB (${imgCount} ảnh riêng biệt)`;
          }
          body.querySelector("#saveNewsUrlBtn").addEventListener("click", () => {
            state.newsUrl = body.querySelector("#setNewsUrl").value.trim() || "./news.json";
            saveState();
            fetchNews(true);
            closeModal();
          });
          body.querySelector("#resetNewsUrlBtn").addEventListener("click", () => {
            state.newsUrl = "./news.json";
            body.querySelector("#setNewsUrl").value = "./news.json";
            saveState();
            fetchNews(true);
          });
          const lastBkEl = body.querySelector("#lastBackupMeta");
          if (lastBkEl) {
            lastBkEl.textContent = state.lastBackupAt
              ? `Lần sao lưu gần nhất: ${state.lastBackupAt}`
              : "Chưa xuất file sao lưu lần nào.";
          }

          body.querySelector("#exportJsonBtn").addEventListener("click", async () => {
            const fileName = `tusach-backup-${todayISO()}.json`;
            const jsonText = JSON.stringify(state, null, 2);
            const blob = new Blob([jsonText], { type: "application/json" });

            state.lastBackupAt = new Date().toLocaleString("vi-VN", { hour12: false });
            saveState();
            if (lastBkEl) lastBkEl.textContent = `Lần sao lưu gần nhất: ${state.lastBackupAt}`;

            // Ưu tiên bảng Chia sẻ gốc trên iPhone để lưu thẳng vào iCloud Drive / Tệp
            try {
              const file = new File([blob], fileName, { type: "application/json" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ title: "Sao lưu Tủ Sách", files: [file] });
                showToast("Đã mở bảng chia sẻ lưu file.");
                return;
              }
            } catch (err) {
              if (err && err.name === "AbortError") return;
            }

            // Fallback tải file chuẩn (trì hoãn revokeObjectURL 15s để Safari iOS không cắt mất file)
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 15000);
            showToast("Đã xuất file sao lưu .json.");
          });

          body.querySelector("#recoverShadowBtn").addEventListener("click", () => {
            const sh = readTextOnlyShadow();
            if (!sh || !Array.isArray(sh.series) || !sh.series.length) {
              showToast("Chưa có bản dự phòng khẩn cấp nào trên máy.");
              return;
            }
            const shCount = sh.series.length;
            const shVols = sh.series.reduce((acc, x) => acc + getAllSeriesVolumes(x).length, 0);
            if (!confirm(`Tìm thấy bản dự phòng chữ (${shCount} bộ · ${shVols} tập, không gồm ảnh). Khôi phục bản này?`)) {
              return;
            }
            state = migrateStateData(sh);
            saveState();
            renderAll();
            closeModal();
            showToast("Đã khôi phục bản dự phòng khẩn cấp.");
          });
          body.querySelector("#importJsonBtn").addEventListener("click", () => {
            document.getElementById("importFileInput").click();
          });
          body.querySelector("#loadSampleBtn").addEventListener("click", () => {
            if (state.series.length && !confirm("Thêm 3 bộ mẫu vào tủ hiện tại?")) return;
            const d = todayISO();
            state.series.push(
              {
                id: uid(),
                title: "Dungeon Meshi — Mỹ Vị Hầm Ngục",
                publisher: "Kim Đồng",
                category: "Manga",
                status: "Đã full",
                aliases: "Dungeon Meshi, Mỹ Vị Hầm Ngục",
                note: "Bản in có áo bọc",
                cover: "",
                createdAt: d,
                sections: [
                  {
                    id: uid(),
                    name: "Manga — Bản thường",
                    note: "",
                    volumes: [1, 2, 3].map((n) => ({
                      id: uid(),
                      number: n,
                      coverPrice: 40000,
                      paidPrice: 34000,
                      date: d,
                      image: "",
                      note: "",
                    })),
                  },
                  {
                    id: uid(),
                    name: "Limited",
                    note: "Bản đặc biệt kèm postcard",
                    volumes: [
                      { id: uid(), number: 4, coverPrice: 75000, paidPrice: 75000, date: d, image: "", note: "Kèm postcard" },
                    ],
                  },
                ],
              },
              {
                id: uid(),
                title: "JoJo's Bizarre Adventure — Phần 1",
                publisher: "Kim Đồng",
                category: "Manga",
                status: "Đang theo",
                aliases: "JoJo, Phantom Blood",
                note: "Bìa cứng",
                cover: "",
                createdAt: d,
                sections: [
                  {
                    id: uid(),
                    name: "Boxset",
                    note: "Hộp cứng 3 tập",
                    volumes: [1, 2, 3].map((n) => ({
                      id: uid(),
                      number: n,
                      coverPrice: 120000,
                      paidPrice: 102000,
                      date: d,
                      image: "",
                      note: "Boxset tập 1–3",
                    })),
                  },
                ],
              },
              {
                id: uid(),
                title: "Rừng Na Uy",
                publisher: "Nhã Nam",
                category: "Sách",
                status: "Đã full",
                aliases: "Norwegian Wood",
                note: "",
                cover: "",
                createdAt: d,
                sections: [
                  {
                    id: uid(),
                    name: "Tái bản",
                    note: "Bìa mới",
                    volumes: [
                      { id: uid(), number: 1, coverPrice: 149000, paidPrice: 118000, date: d, image: "", note: "Kèm bookmark" },
                    ],
                  },
                ],
              }
            );
            state.giftGroups.push({
              id: uid(),
              title: "Dungeon Meshi — Mỹ Vị Hầm Ngục",
              publisher: "Kim Đồng",
              cover: "",
              note: "Săn tại Fes & kèm bản ĐB",
              createdAt: d,
              gifts: [
                {
                  id: uid(),
                  name: "Standee Acrylic Marcille",
                  quantity: 1,
                  price: 95000,
                  source: "Săn tại Fes",
                  status: "Đã có",
                  date: d,
                  image: "",
                  note: "Mua tại booth Kim Đồng",
                },
                {
                  id: uid(),
                  name: "Bộ Postcard bản ĐB tập 4",
                  quantity: 2,
                  price: 0,
                  source: "Kèm bản ĐB",
                  status: "Đã có",
                  date: d,
                  image: "",
                  note: "Kèm sách",
                },
              ],
            });
            saveState();
            renderAll();
            closeModal();
            showToast("Đã nạp 3 bộ mẫu + bộ quà mẫu.");
          });
          body.querySelector("#wipeAllBtn").addEventListener("click", () => {
            if (!confirm("Xoá sạch toàn bộ sách, quà và mục đã ghim?")) return;
            state = structuredClone(DEFAULT_STATE);
            saveState();
            applyTheme();
            renderAll();
            closeModal();
            showToast("Đã đặt lại sạch sẽ.");
          });
        });
      }

      document.getElementById("importFileInput").addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!Array.isArray(parsed.series)) throw new Error("Sai định dạng");
            state = migrateStateData(parsed);
            saveState();
            applyTheme();
            renderAll();
            closeModal();
            showToast("Đã khôi phục dữ liệu thành công.");
          } catch {
            showToast("File sao lưu không hợp lệ.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      // ============================
      // EVENT WIRING
      // ============================
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
          document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === `view-${tab}`));
          if (tab === "spending") renderSpending();
          if (tab === "news") renderNews();
        });
      });

      document.getElementById("themeBtn").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        saveState();
        applyTheme();
      });

      document.getElementById("settingsBtn").addEventListener("click", openSettingsModal);
      document.getElementById("addSeriesBtn").addEventListener("click", () => openSeriesForm());
      document.getElementById("addGiftGroupBtn").addEventListener("click", () => openGiftGroupForm());
      document.getElementById("manualPinBtn").addEventListener("click", openManualPinForm);
      document.getElementById("refreshNewsBtn").addEventListener("click", () => fetchNews(true));

      document.getElementById("editBudgetBtn").addEventListener("click", () => {
        const val = prompt("Nhập hạn mức chi tiêu tháng (VNĐ):", String(state.budgetLimit || 1000000));
        if (val === null) return;
        const num = Number(val.replace(/[^\d]/g, ""));
        if (num > 0) {
          state.budgetLimit = num;
          saveState();
          renderSpending();
          showToast(`Đã đặt hạn mức ${fmtMoney(num)}/tháng.`);
        }
      });

      document.getElementById("bookGroupSwitch").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-group]");
        if (!btn) return;
        filters.bookGroup = btn.dataset.group;
        if (filters.bookGroup === "truyen" && filters.bookCat === "Sách") {
          filters.bookCat = "Tất cả";
          document.querySelectorAll("#bookCatChips .chip").forEach((c) => c.classList.toggle("active", c.dataset.cat === "Tất cả"));
        }
        document.querySelectorAll("#bookGroupSwitch button").forEach((b) => b.classList.toggle("active", b === btn));
        renderBooks();
      });

      document.getElementById("bookSortSel").addEventListener("change", (e) => {
        filters.bookSort = e.target.value;
        renderBooks();
      });

            document.getElementById("bookSearch").addEventListener("input", (e) => {
        filters.bookSearch = e.target.value;
        renderBooks();
      });

      document.getElementById("bookCatChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.bookCat = btn.dataset.cat;
        document.querySelectorAll("#bookCatChips .chip").forEach((c) => c.classList.toggle("active", c === btn));
        renderBooks();
      });

      document.getElementById("bookPubChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.bookPub = btn.dataset.pub;
        document.querySelectorAll("#bookPubChips .chip").forEach((c) => c.classList.toggle("active", c === btn));
        renderBooks();
      });

      document.getElementById("bookViewSeg").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        state.bookView = btn.dataset.mode;
        saveState();
        document.querySelectorAll("#bookViewSeg button").forEach((b) => b.classList.toggle("active", b === btn));
        renderBooks();
      });

      document.getElementById("merchSearch").addEventListener("input", (e) => {
        filters.merchSearch = e.target.value;
        renderMerch();
      });

      document.getElementById("merchPubChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.merchPub = btn.dataset.pub;
        document.querySelectorAll("#merchPubChips .chip").forEach((c) => c.classList.toggle("active", c === btn));
        renderMerch();
      });

      document.getElementById("newsPubChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.newsPub = btn.dataset.pub;
        document.querySelectorAll("#newsPubChips .chip").forEach((c) => c.classList.toggle("active", c === btn));
        renderNews();
      });

      document.getElementById("newsTypeChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.newsType = btn.dataset.type;
        document.querySelectorAll("#newsTypeChips .chip").forEach((c) => c.classList.toggle("active", c === btn));
        renderNews();
      });

      document.getElementById("newsScopeSwitch").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-scope]");
        if (!btn) return;
        filters.newsScope = btn.dataset.scope;
        document.querySelectorAll("#newsScopeSwitch button").forEach((b) => b.classList.toggle("active", b === btn));
        renderNews();
      });

      document.getElementById("newsChanChips").addEventListener("click", (e) => {
        const btn = e.target.closest(".chip");
        if (!btn) return;
        filters.newsChan = btn.dataset.chan;
        document.querySelectorAll("#newsChanChips .chip[data-chan]").forEach((c) => c.classList.toggle("active", c === btn));
        renderNews();
      });

      function renderAll() {
        updateHeaderSummary();
        document.querySelectorAll("#bookViewSeg button").forEach((b) =>
          b.classList.toggle("active", b.dataset.mode === state.bookView)
        );
        renderBooks();
        renderMerch();
        renderNews();
        renderSpending();
      }

      async function initApp() {
        const ok = await loadStateAsync();
        applyTheme();
        if (ok) {
          renderAll();
          fetchNews(false);
        }
      }

      initApp();
    })();
  </script>
</body>
</html>
