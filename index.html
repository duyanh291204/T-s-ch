      function openSeriesForm(existingId = null) {
        const s = existingId ? state.series.find((x) => x.id === existingId) : null;
        let currentCover = resolveImg(s?.cover || "");

        const html = `
          <form id="seriesForm" class="form-grid">
            <div class="field">
              <label>Tên bộ truyện / Đầu sách *</label>
              <input name="title" required value="${esc(s?.title || "")}" placeholder="VD: Dungeon Meshi, Chainsaw Man, Rừng Na Uy..." />
            </div>
            <div class="form-row-2">
              <div class="field">
                <label>Nhà xuất bản</label>
                <select name="publisher">
                  ${["Trẻ", "Kim Đồng", "IPM", "Nhã Nam", "Khác"]
                    .map((p) => `<option value="${p}" ${s?.publisher === p ? "selected" : ""}>${p}</option>`)
                    .join("")}
                </select>
              </div>
              <div class="field">
                <label>Danh mục</label>
                <select name="category">
                  ${["Manga", "Light Novel", "Sách", "Artbook"]
                    .map((c) => `<option value="${c}" ${s?.category === c ? "selected" : ""}>${c}</option>`)
                    .join("")}
                </select>
              </div>
            </div>
            <div class="field">
              <label>Trạng thái theo dõi</label>
              <select name="status">
                ${["Đang theo", "Đã full", "Tạm ngưng"]
                  .map((st) => `<option value="${st}" ${s?.status === st ? "selected" : ""}>${st}</option>`)
                  .join("")}
              </select>
            </div>
            <div class="field">
              <label>Ảnh bìa đại diện (tuỳ chọn)</label>
              <div class="cover-preview-wrap">
                <div class="cover-preview" id="coverPreviewBox">
                  ${currentCover ? `<img src="${esc(currentCover)}" alt="" referrerpolicy="no-referrer" />` : "Bìa chữ"}
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <label class="btn btn-sm" style="margin:0;">
                    ${currentCover ? "Đổi ảnh" : "Chọn ảnh từ máy"}
                    <input type="file" id="coverFileInput" accept="image/*" style="display:none;" />
                  </label>
                  <button type="button" class="btn btn-sm btn-danger" id="clearCoverBtn" style="${currentCover ? "" : "display:none;"}">Xoá ảnh</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label>Tên khác / Từ khoá bắt tin NXB (cách nhau dấu phẩy, tuỳ chọn)</label>
              <input name="aliases" value="${esc(s?.aliases || "")}" placeholder="VD: Mỹ Vị Hầm Ngục, Dungeon Meshi, JoJo, ORV..." />
            </div>
            <div class="field">
              <label>Ghi chú</label>
              <textarea name="note" placeholder="Bản in, bọc plastic, chỗ hay mua...">${esc(s?.note || "")}</textarea>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn" id="cancelSeriesBtn">Huỷ</button>
              <button type="submit" class="btn btn-primary">${s ? "Lưu thay đổi" : "Tạo đầu sách"}</button>
            </div>
          </form>`;

        openModal(s ? "Sửa đầu sách" : "Thêm đầu sách mới", html, (body) => {
          const previewBox = body.querySelector("#coverPreviewBox");
          const clearBtn = body.querySelector("#clearCoverBtn");

          const setPreview = (url) => {
            currentCover = url || "";
            previewBox.innerHTML = currentCover
              ? `<img src="${esc(currentCover)}" alt="" referrerpolicy="no-referrer" />`
              : "Bìa chữ";
            clearBtn.style.display = currentCover ? "" : "none";
          };

          body.querySelector("#cancelSeriesBtn").addEventListener("click", closeModal);
          clearBtn.addEventListener("click", () => {
            setPreview("");
            showToast("Đã xoá ảnh bìa.");
          });

          body.querySelector("#coverFileInput").addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              const compressed = await compressImageFile(file, 320, 480, 0.74);
              setPreview(compressed);
            } catch {
              showToast("Không đọc được ảnh này.");
            }
          });

          body.querySelector("#seriesForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const title = fd.get("title").trim();
            if (!title) return;
            if (s) {
              s.title = title;
              s.publisher = fd.get("publisher");
              s.category = fd.get("category");
              s.status = fd.get("status");
              s.aliases = (fd.get("aliases") || "").trim();
              s.note = fd.get("note").trim();
              s.cover = currentCover;
              saveState();
              renderBooks();
              renderNews();
              renderSpending();
              openSeriesDetail(s.id);
              showToast("Đã cập nhật đầu sách.");
            } else {
              const newS = {
                id: uid(),
                title,
                publisher: fd.get("publisher"),
                category: fd.get("category"),
                status: fd.get("status"),
                aliases: (fd.get("aliases") || "").trim(),
                note: fd.get("note").trim(),
                cover: currentCover,
                sections: [],
                createdAt: todayISO(),
              };
              state.series.unshift(newS);
              saveState();
              renderBooks();
              renderNews();
              renderSpending();
              openSeriesDetail(newS.id);
              showToast("Đã thêm vào tủ — giờ tạo các mục bên trong nhé.");
            }
          });
        });
      }

      // Cấp 1 bên trong Manga / Sách: Quản lý CÁC MỤC (Manga, Boxset, Limited, Tái bản...)
      function openSeriesDetail(seriesId) {
        const s = state.series.find((x) => x.id === seriesId);
        if (!s) return;
        const sections = s.sections || [];
        const allVols = getAllSeriesVolumes(s);
        const totalCover = allVols.reduce((a, v) => a + (Number(v.coverPrice) || 0), 0);
        const totalPaid = allVols.reduce((a, v) => a + (Number(v.paidPrice) || 0), 0);
        const diff = totalCover - totalPaid;

        const sectionsHtml = sections.length
          ? `<div class="section-list">${sections
              .map((sec) => {
                const vols = sec.volumes || [];
                const secPaid = vols.reduce((a, v) => a + (Number(v.paidPrice) || 0), 0);
                const imgCount = vols.filter((v) => v.image).length;
                return `
                  <button type="button" class="section-card" data-open-sec="${sec.id}">
                    <div style="min-width:0; flex:1;">
                      <div class="section-card-title">
                        <span>${esc(sec.name)}</span>
                        <span class="tag mono">${vols.length} tập</span>
                      </div>
                      <div class="section-card-sub mono">
                        Thực chi ${fmtMoney(secPaid)}${imgCount ? ` · ${imgCount} ảnh` : ""}${sec.note ? ` · ${esc(sec.note)}` : ""}
                      </div>
                    </div>
                    <span class="section-arrow">Mở →</span>
                  </button>`;
              })
              .join("")}</div>`
          : `<div class="empty" style="padding:20px 14px; margin:10px 0;">
               <div class="empty-title" style="font-size:13px;">Chưa có mục nào</div>
               <div class="empty-desc" style="margin-bottom:10px;">Tạo các mục như <strong>Manga</strong>, <strong>Boxset</strong>, <strong>Limited</strong>, <strong>Tái bản</strong>... rồi bấm vào từng mục để thêm số tập, ảnh và giá.</div>
               <button type="button" class="btn btn-sm btn-primary" id="emptyCreateSecBtn">+ Tạo mục đầu tiên</button>
             </div>`;

        const html = `
          <div style="display:flex; gap:12px; align-items:flex-start;">
            <div class="cover-preview" style="width:66px; height:99px; border-left:3px solid ${pubColorVar(s.publisher)}">
              ${resolveImg(s.cover) ? `<img src="${esc(resolveImg(s.cover))}" alt="" referrerpolicy="no-referrer" />` : `<span class="mono" style="text-align:center; padding:4px;">${esc(s.publisher)}</span>`}
            </div>
            <div style="flex:1; min-width:0;">
              <div style="font-size:15px; font-weight:700; line-height:1.3;">${esc(s.title)}</div>
              <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;">
                <span class="tag">${esc(s.publisher)}</span>
                <span class="tag">${esc(s.category)}</span>
                <span class="tag">${esc(s.status || "Đang theo")}</span>
              </div>
              <div class="mono small-muted" style="margin-top:8px;">
                ${sections.length} mục · ${allVols.length} tập · Thực chi ${fmtMoney(totalPaid)}<br/>
                Giá bìa ${fmtMoney(totalCover)} (${diff >= 0 ? `tiết kiệm ${fmtMoney(diff)}` : `chênh +${fmtMoney(-diff)}`})
              </div>
            </div>
          </div>
          ${s.note ? `<div class="small-muted" style="margin-top:8px; padding:7px 9px; background:var(--surface); border:1px solid var(--line);">${esc(s.note)}</div>` : ""}

          <div class="divider"></div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span class="panel-title">Các mục (${sections.length})</span>
            <button type="button" class="btn btn-sm btn-primary" id="addSectionBtn">+ Tạo mục</button>
          </div>
          ${sectionsHtml}

          <div class="modal-actions" style="justify-content:space-between;">
            <button type="button" class="btn btn-sm btn-danger" id="delSeriesBtn">Xoá bộ này</button>
            <button type="button" class="btn btn-sm" id="editSeriesBtn">Sửa thông tin bộ</button>
          </div>`;

        openModal(s.title, html, (body) => {
          body.querySelector("#addSectionBtn").addEventListener("click", () => openSectionForm(seriesId));
          const emptyBtn = body.querySelector("#emptyCreateSecBtn");
          if (emptyBtn) emptyBtn.addEventListener("click", () => openSectionForm(seriesId));
          body.querySelector("#editSeriesBtn").addEventListener("click", () => openSeriesForm(seriesId));
          body.querySelector("#delSeriesBtn").addEventListener("click", () => {
            if (!confirm(`Xoá bộ "${s.title}" cùng toàn bộ ${sections.length} mục và ${allVols.length} tập?`)) return;
            state.series = state.series.filter((x) => x.id !== seriesId);
            saveState();
            renderBooks();
            renderNews();
            renderSpending();
            closeModal();
            showToast("Đã xoá đầu sách.");
          });
          body.querySelectorAll("[data-open-sec]").forEach((btn) => {
            btn.addEventListener("click", () => openSectionDetail(seriesId, btn.dataset.openSec));
          });
        });
      }

      // Form tạo / sửa Mục bên trong đầu sách
      function openSectionForm(seriesId, sectionId = null) {
        const s = state.series.find((x) => x.id === seriesId);
        if (!s) return;
        const sec = sectionId ? (s.sections || []).find((x) => x.id === sectionId) : null;
        const presets = ["Manga", "Bản thường", "Boxset", "Limited", "Tái bản", "Bìa cứng", "Artbook", "Sách chữ"];

        const html = `
          <form id="sectionForm" class="form-grid">
            <div class="field">
              <label>Tên mục *</label>
              <input name="name" id="secNameInput" required value="${esc(sec?.name || "")}" placeholder="VD: Manga, Boxset, Limited, Tái bản..." />
              <div class="preset-chips">
                ${presets.map((p) => `<button type="button" class="preset-chip" data-preset="${esc(p)}">${esc(p)}</button>`).join("")}
              </div>
            </div>
            <div class="field">
              <label>Ghi chú mục (tuỳ chọn)</label>
              <input name="note" value="${esc(sec?.note || "")}" placeholder="VD: Bản có áo bọc, hộp cứng, in lần đầu..." />
            </div>
            <div class="modal-actions" style="justify-content:space-between;">
              <button type="button" class="btn btn-sm" id="backFromSecFormBtn">Quay lại</button>
              <button type="submit" class="btn btn-sm btn-primary">${sec ? "Lưu mục" : "Tạo mục"}</button>
            </div>
          </form>`;

        openModal(`${s.title} — ${sec ? "Sửa mục" : "Tạo mục mới"}`, html, (body) => {
          const nameInput = body.querySelector("#secNameInput");
          body.querySelectorAll("[data-preset]").forEach((chip) => {
            chip.addEventListener("click", () => {
              nameInput.value = chip.dataset.preset;
              nameInput.focus();
            });
          });
          body.querySelector("#backFromSecFormBtn").addEventListener("click", () => {
            if (sec) openSectionDetail(seriesId, sec.id);
            else openSeriesDetail(seriesId);
          });
          body.querySelector("#sectionForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const name = fd.get("name").trim();
            if (!name) return;
            s.sections = s.sections || [];
            if (sec) {
              sec.name = name;
              sec.note = fd.get("note").trim();
              saveState();
              renderBooks();
              openSectionDetail(seriesId, sec.id);
              showToast("Đã cập nhật mục.");
            } else {
              const newSec = {
                id: uid(),
                name,
                note: fd.get("note").trim(),
                volumes: [],
              };
              s.sections.push(newSec);
              saveState();
              renderBooks();
              openSectionDetail(seriesId, newSec.id);
              showToast(`Đã tạo mục "${name}".`);
            }
          });
        });
      }

      // Cấp 2: Bên trong 1 Mục -> xem các tập (kèm ảnh + giá) và thêm tập
      function openSectionDetail(seriesId, sectionId) {
        const s = state.series.find((x) => x.id === seriesId);
        if (!s) return;
        const sec = (s.sections || []).find((x) => x.id === sectionId);
        if (!sec) return openSeriesDetail(seriesId);

        const vols = [...(sec.volumes || [])].sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0));
        const totalCover = vols.reduce((a, v) => a + (Number(v.coverPrice) || 0), 0);
        const totalPaid = vols.reduce((a, v) => a + (Number(v.paidPrice) || 0), 0);
        const diff = totalCover - totalPaid;

        const volsHtml = vols.length
          ? `<div class="vol-card-grid">${vols
              .map((v) => {
                const numStr = String(v.number).padStart(2, "0");
                const volImg = resolveImg(v.image);
                const mediaHtml = volImg
                  ? `<img src="${esc(volImg)}" alt="Tập ${esc(v.number)}" loading="lazy" />
                     <span class="vol-card-badge mono">T.${esc(numStr)}</span>`
                  : `<span class="vol-card-num-big mono">${esc(numStr)}</span>
                     <span class="small-muted" style="font-size:10px; margin-top:2px;">Tập ${esc(v.number)}</span>`;
                return `
                  <button type="button" class="vol-card" data-vol-id="${v.id}">
                    <div class="vol-card-media">${mediaHtml}</div>
                    <div class="vol-card-body">
                      <div class="vol-card-label">Tập ${esc(v.number)}</div>
                      <div class="vol-card-price mono">${fmtMoney(v.paidPrice)}</div>
                    </div>
                  </button>`;
              })
              .join("")}</div>`
          : `<div class="empty" style="padding:20px 14px; margin:10px 0;">
               <div class="empty-title" style="font-size:13px;">Mục "${esc(sec.name)}" chưa có tập nào</div>
               <div class="empty-desc">Bấm <strong>+ 1 tập</strong> để nhập tập kèm ảnh riêng, hoặc <strong>+ Nhiều tập</strong> cho loạt tập / Boxset.</div>
             </div>`;

        const html = `
          <div class="crumb-bar">
            <button type="button" class="btn btn-sm" id="backToSeriesBtn">← ${esc(s.title.slice(0, 24))}</button>
            <div style="display:flex; gap:5px;">
              <button type="button" class="btn btn-sm" id="editSecBtn">Sửa mục</button>
              <button type="button" class="btn btn-sm btn-danger" id="delSecBtn">Xoá mục</button>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
            <div>
              <div style="font-size:15px; font-weight:700;">${esc(sec.name)}</div>
              <div class="mono small-muted" style="margin-top:3px;">
                ${vols.length} tập · Thực chi ${fmtMoney(totalPaid)} · Giá bìa ${fmtMoney(totalCover)}
                ${diff > 0 ? ` (tiết kiệm ${fmtMoney(diff)})` : ""}
              </div>
              ${sec.note ? `<div class="small-muted" style="margin-top:3px;">${esc(sec.note)}</div>` : ""}
            </div>
          </div>

          <div class="divider"></div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
            <span class="panel-title">Danh sách tập (chạm để sửa / xem ảnh)</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="btn btn-sm" id="addBulkVolBtn">+ Nhiều tập</button>
              <button type="button" class="btn btn-sm btn-primary" id="addOneVolBtn">+ 1 tập</button>
            </div>
          </div>

          ${volsHtml}`;

        openModal(`${s.title} / ${sec.name}`, html, (body) => {
          body.querySelector("#backToSeriesBtn").addEventListener("click", () => openSeriesDetail(seriesId));
          body.querySelector("#editSecBtn").addEventListener("click", () => openSectionForm(seriesId, sectionId));
          body.querySelector("#delSecBtn").addEventListener("click", () => {
            if (!confirm(`Xoá mục "${sec.name}" cùng ${vols.length} tập bên trong?`)) return;
            s.sections = (s.sections || []).filter((x) => x.id !== sectionId);
            saveState();
            renderBooks();
            renderSpending();
            openSeriesDetail(seriesId);
            showToast(`Đã xoá mục "${sec.name}".`);
          });
          body.querySelector("#addOneVolBtn").addEventListener("click", () => openVolumeForm(seriesId, sectionId));
          body.querySelector("#addBulkVolBtn").addEventListener("click", () => openBulkVolumeForm(seriesId, sectionId));
          body.querySelectorAll("[data-vol-id]").forEach((btn) => {
            btn.addEventListener("click", () => openVolumeForm(seriesId, sectionId, btn.dataset.volId));
          });
        });
      }

      // Thêm / sửa 1 tập trong Mục (hỗ trợ Ảnh riêng từng tập + Giá bìa + Thực chi)
      function openVolumeForm(seriesId, sectionId, volId = null) {
        const s = state.series.find((x) => x.id === seriesId);
        const sec = s ? (s.sections || []).find((x) => x.id === sectionId) : null;
        if (!s || !sec) return;
        const v = volId ? (sec.volumes || []).find((x) => x.id === volId) : null;
        const maxNum = (sec.volumes || []).reduce((m, x) => Math.max(m, Number(x.number) || 0), 0);
        const lastVol = (sec.volumes || [])[(sec.volumes || []).length - 1];
        const groupSiblings = v?.groupId
          ? (sec.volumes || []).filter((x) => x.groupId === v.groupId)
          : [];
        let currentImg = resolveImg(v?.image || "");

        const html = `
          <form id="volForm" class="form-grid">
            <div class="field">
              <label>Số tập *</label>
              <input name="number" type="number" step="0.5" required value="${esc(v ? v.number : maxNum + 1)}" />
            </div>

            <div class="field">
              <label>Ảnh tập truyện / sách (tuỳ chọn)</label>
              <div class="cover-preview-wrap">
                <div class="cover-preview" id="volImgPreview" style="cursor:${currentImg ? "zoom-in" : "default"};">
                  ${currentImg ? `<img src="${esc(currentImg)}" alt="" />` : "Chưa có"}
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <label class="btn btn-sm" style="margin:0;">
                    ${currentImg ? "Đổi ảnh" : "Chọn ảnh"}
                    <input type="file" id="volImgInput" accept="image/*" style="display:none;" />
                  </label>
                  <button type="button" class="btn btn-sm btn-danger" id="clearVolImgBtn" style="${currentImg ? "" : "display:none;"}">Xoá ảnh</button>
                </div>
              </div>
            </div>

            <div class="form-row-2">
              <div class="field">
                <label>Giá bìa (VNĐ)</label>
                <input name="coverPrice" type="number" min="0" value="${v ? v.coverPrice : lastVol?.coverPrice ?? 35000}" />
              </div>
              <div class="field">
                <label>Thực chi (VNĐ)</label>
                <input name="paidPrice" type="number" min="0" value="${v ? v.paidPrice : lastVol?.paidPrice ?? 30000}" />
              </div>
            </div>

            <div class="field">
              <label>Ngày mua</label>
              <input name="date" type="date" value="${esc(v?.date || todayISO())}" />
            </div>

            <div class="field">
              <label>Ghi chú (Obi, bookmark, nơi mua...)</label>
              <input name="note" value="${esc(v?.note || "")}" placeholder="VD: Kèm obi + postcard, mua Shopee" />
            </div>

            <div class="modal-actions" style="justify-content:space-between; flex-wrap:wrap;">
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                ${v ? `<button type="button" class="btn btn-sm btn-danger" id="delVolBtn">Xoá tập</button>` : ""}
                ${
                  groupSiblings.length > 1
                    ? `<button type="button" class="btn btn-sm btn-danger" id="delVolGroupBtn">Xoá cả đợt (${groupSiblings.length} tập)</button>`
                    : ""
                }
              </div>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn-sm" id="backSecBtn">Quay lại</button>
                <button type="submit" class="btn btn-sm btn-primary">${v ? "Lưu" : "Thêm tập"}</button>
              </div>
            </div>
          </form>`;

        openModal(`${sec.name} — ${v ? `Tập ${v.number}` : "Thêm 1 tập"}`, html, (body) => {
          const previewEl = body.querySelector("#volImgPreview");
          const clearBtn = body.querySelector("#clearVolImgBtn");

          const setVolPreview = (url) => {
            currentImg = url || "";
            previewEl.innerHTML = currentImg ? `<img src="${esc(currentImg)}" alt="" />` : "Chưa có";
            previewEl.style.cursor = currentImg ? "zoom-in" : "default";
            clearBtn.style.display = currentImg ? "" : "none";
          };

          previewEl.addEventListener("click", () => {
            if (!currentImg) return;
            openImageLightbox(currentImg, `${s.title} — ${sec.name} (Tập ${v ? v.number : ""})`, () =>
              openVolumeForm(seriesId, sectionId, volId)
            );
          });

          clearBtn.addEventListener("click", () => {
            setVolPreview("");
            showToast("Đã xoá ảnh tập.");
          });

          body.querySelector("#volImgInput").addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              const compressed = await compressImageFile(file, 360, 540, 0.74);
              setVolPreview(compressed);
            } catch {
              showToast("Không đọc được ảnh này.");
            }
          });

          body.querySelector("#backSecBtn").addEventListener("click", () => openSectionDetail(seriesId, sectionId));

          const delBtn = body.querySelector("#delVolBtn");
          if (delBtn) {
            delBtn.addEventListener("click", () => {
              sec.volumes = (sec.volumes || []).filter((x) => x.id !== volId);
              saveState();
              renderBooks();
              renderSpending();
              openSectionDetail(seriesId, sectionId);
              showToast("Đã xoá tập.");
            });
          }

          const delGrpBtn = body.querySelector("#delVolGroupBtn");
          if (delGrpBtn && v?.groupId) {
            delGrpBtn.addEventListener("click", () => {
              if (!confirm(`Xoá toàn bộ ${groupSiblings.length} tập thuộc ${v.groupLabel || "đợt này"}?`)) return;
              sec.volumes = (sec.volumes || []).filter((x) => x.groupId !== v.groupId);
              saveState();
              renderBooks();
              renderSpending();
              openSectionDetail(seriesId, sectionId);
              showToast(`Đã xoá ${groupSiblings.length} tập.`);
            });
          }

          body.querySelector("#volForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const rec = {
              id: v?.id || uid(),
              number: Number(fd.get("number")),
              coverPrice: Math.max(0, Number(fd.get("coverPrice")) || 0),
              paidPrice: Math.max(0, Number(fd.get("paidPrice")) || 0),
              date: fd.get("date") || todayISO(),
              image: currentImg,
              note: fd.get("note").trim(),
              groupId: v?.groupId || "",
              groupLabel: v?.groupLabel || "",
            };
            sec.volumes = sec.volumes || [];
            if (v) {
              const idx = sec.volumes.findIndex((x) => x.id === volId);
              sec.volumes[idx] = rec;
            } else {
              sec.volumes.push(rec);
            }
            saveState();
            renderBooks();
            renderSpending();
            openSectionDetail(seriesId, sectionId);
            showToast(v ? "Đã lưu tập." : `Đã thêm tập ${rec.number}.`);
          });
        });
      }

      // Thêm nhiều tập / Boxset vào trong 1 Mục
      function openBulkVolumeForm(seriesId, sectionId) {
        const s = state.series.find((x) => x.id === seriesId);
        const sec = s ? (s.sections || []).find((x) => x.id === sectionId) : null;
        if (!s || !sec) return;
        const maxNum = (sec.volumes || []).reduce((m, x) => Math.max(m, Number(x.number) || 0), 0);
        const looksLikeBox = /box|set|combo|hộp/i.test(sec.name);
        let sharedImg = "";

        const html = `
          <form id="bulkVolForm" class="form-grid">
            <div class="form-row-2">
              <div class="field">
                <label>Từ tập *</label>
                <input name="from" type="number" min="1" required value="${maxNum + 1}" />
              </div>
              <div class="field">
                <label>Đến tập *</label>
                <input name="to" type="number" min="1" required value="${maxNum + (looksLikeBox ? 5 : 10)}" />
              </div>
            </div>

            <div class="field">
              <label>Cách nhập giá</label>
              <select name="priceMode" id="bulkPriceModeSel">
                <option value="total" ${looksLikeBox ? "selected" : ""}>Tổng giá cả đợt / Boxset (tự chia đều)</option>
                <option value="unit" ${!looksLikeBox ? "selected" : ""}>Giá từng tập + % chiết khấu</option>
              </select>
            </div>

            <div class="form-row-2" id="bulkTotalPrices" style="${looksLikeBox ? "" : "display:none;"}">
              <div class="field">
                <label>Tổng giá bìa cả bộ (VNĐ)</label>
                <input name="totalCover" type="number" min="0" value="250000" />
              </div>
              <div class="field">
                <label>Tổng thực chi (VNĐ)</label>
                <input name="totalPaid" type="number" min="0" value="210000" />
              </div>
            </div>

            <div class="form-row-2" id="bulkUnitPrices" style="${!looksLikeBox ? "" : "display:none;"}">
              <div class="field">
                <label>Giá bìa / tập (VNĐ)</label>
                <input name="unitCover" type="number" min="0" value="35000" />
              </div>
              <div class="field">
                <label>Chiết khấu (%)</label>
                <input name="discount" type="number" min="0" max="100" value="15" />
              </div>
            </div>

            <div class="boxset-hint mono" id="bulkPreview"></div>

            <div class="field">
              <label>Ảnh chung cho đợt / hộp Boxset (tuỳ chọn)</label>
              <div class="cover-preview-wrap">
                <div class="cover-preview" id="bulkImgPreview">Chưa có</div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <label class="btn btn-sm" style="margin:0;">
                    Chọn ảnh
                    <input type="file" id="bulkImgInput" accept="image/*" style="display:none;" />
                  </label>
                  <button type="button" class="btn btn-sm btn-danger" id="clearBulkImgBtn" style="display:none;">Xoá ảnh</button>
                </div>
              </div>
            </div>

            <div class="form-row-2">
              <div class="field">
                <label>Ngày mua</label>
                <input name="date" type="date" value="${todayISO()}" />
              </div>
              <div class="field">
                <label>Ghi chú</label>
                <input name="note" placeholder="VD: Box cứng + postcard..." />
              </div>
            </div>

            <div class="modal-actions">
              <button type="button" class="btn btn-sm" id="backBulkBtn">Quay lại</button>
              <button type="submit" class="btn btn-sm btn-primary">Thêm hàng loạt</button>
            </div>
          </form>`;

        openModal(`${sec.name} — Thêm nhiều tập`, html, (body) => {
          const form = body.querySelector("#bulkVolForm");
          const modeSel = body.querySelector("#bulkPriceModeSel");
          const totalWrap = body.querySelector("#bulkTotalPrices");
          const unitWrap = body.querySelector("#bulkUnitPrices");
          const preview = body.querySelector("#bulkPreview");
          const imgPrev = body.querySelector("#bulkImgPreview");
          const clearImgBtn = body.querySelector("#clearBulkImgBtn");

          const updateUI = () => {
            const isTotal = modeSel.value === "total";
            totalWrap.style.display = isTotal ? "grid" : "none";
            unitWrap.style.display = isTotal ? "none" : "grid";
            const f = Math.round(Number(form.from.value) || 0);
            const t = Math.round(Number(form.to.value) || 0);
            const count = t - f + 1;
            if (count < 1) {
              preview.textContent = "Đến tập phải lớn hơn hoặc bằng Từ tập.";
              return;
            }
            if (isTotal) {
              const tc = Math.max(0, Number(form.totalCover.value) || 0);
              const tp = Math.max(0, Number(form.totalPaid.value) || 0);
              const avg = Math.round(tp / count);
              preview.textContent = `${count} tập (Tập ${f}–${t}) · Tổng ${fmtMoney(tp)} (~${fmtMoney(avg)}/tập)` +
                (tc > tp ? ` · Tiết kiệm ${fmtMoney(tc - tp)}` : "");
            } else {
              const cp = Math.max(0, Number(form.unitCover.value) || 0);
              const d = Math.min(100, Math.max(0, Number(form.discount.value) || 0));
              const paid = Math.round(cp * (1 - d / 100));
              preview.textContent = `${count} tập (Tập ${f}–${t}) · ${fmtMoney(paid)}/tập (Tổng ${fmtMoney(paid * count)})`;
            }
          };

          modeSel.addEventListener("change", updateUI);
          form.addEventListener("input", updateUI);
          updateUI();

          clearImgBtn.addEventListener("click", () => {
            sharedImg = "";
            imgPrev.innerHTML = "Chưa có";
            clearImgBtn.style.display = "none";
          });

          body.querySelector("#bulkImgInput").addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              sharedImg = await compressImageFile(file, 320, 480, 0.72);
              imgPrev.innerHTML = `<img src="${esc(sharedImg)}" alt="" />`;
              clearImgBtn.style.display = "";
            } catch {
              showToast("Không đọc được ảnh này.");
            }
          });

          body.querySelector("#backBulkBtn").addEventListener("click", () => openSectionDetail(seriesId, sectionId));

          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const f = Math.round(Number(form.from.value));
            const t = Math.round(Number(form.to.value));
            if (t < f || t - f > 150) {
              showToast("Khoảng tập không hợp lệ (tối đa 150 tập/lần).");
              return;
            }
            const isTotal = modeSel.value === "total";
            const count = addBatchVolumesToSection(sec, {
              from: f,
              to: t,
              priceMode: isTotal ? "total" : "unit",
              coverInput: isTotal ? form.totalCover.value : form.unitCover.value,
              paidInput: form.totalPaid.value,
              discount: form.discount.value,
              date: form.date.value || todayISO(),
              image: sharedImg,
              note: form.note.value.trim(),
            });
            saveState();
            renderBooks();
            renderSpending();
            openSectionDetail(seriesId, sectionId);
            showToast(`Đã thêm ${count} tập vào "${sec.name}".`);
          });
        });
      }

      // Lightbox xem ảnh to chung cho Tập & Quà
      function openImageLightbox(imgSrc, caption, onBack = null) {
        const html = `
          <div class="img-zoom-wrap">
            <img src="${esc(imgSrc)}" alt="${esc(caption)}" />
            <div style="font-weight:600; font-size:13.5px;">${esc(caption)}</div>
            <div class="modal-actions" style="justify-content:flex-end;">
              <button type="button" class="btn btn-sm btn-primary" id="lbDoneBtn">${onBack ? "Quay lại" : "Đóng"}</button>
            </div>
          </div>`;
        openModal("Xem ảnh", html, (body) => {
          body.querySelector("#lbDoneBtn").addEventListener("click", () => {
            if (typeof onBack === "function") onBack();
            else closeModal();
          });
        });
      }

      // ============================
      // TAB 2: QUÀ & ĐỒ (Manga/Sách có quà -> Thống kê số lượng quà -> Tên, ảnh, giá...)
      // ============================
      const MERCH_STATUSES = ["Đã có", "Đang ship", "Đang săn"];

      function renderMerch() {
        const kpiEl = document.getElementById("giftSummaryKpis");
        const container = document.getElementById("merchContainer");
        const q = normVN(filters.merchSearch);

        // Thống kê tổng toàn bộ quà
        let totalQtyAll = 0;
        let totalTypesAll = 0;
        let totalSpentAll = 0;
        let totalOwnedAll = 0;
        let totalShipAll = 0;
        let totalHuntAll = 0;

        state.giftGroups.forEach((g) => {
          const st = getGroupGiftStats(g);
          totalQtyAll += st.qty;
          totalTypesAll += st.itemCount;
          totalSpentAll += st.spent;
          totalOwnedAll += st.owned;
          totalShipAll += st.shipping;
          totalHuntAll += st.hunting;
        });

        kpiEl.innerHTML = `
          <div class="gift-kpi">
            <div class="gift-kpi-label">Tổng số quà</div>
            <div class="gift-kpi-val mono">${totalQtyAll}</div>
            <div class="small-muted" style="font-size:10.5px;">${totalTypesAll} loại món</div>
          </div>
          <div class="gift-kpi">
            <div class="gift-kpi-label">Bộ có quà</div>
            <div class="gift-kpi-val mono">${state.giftGroups.length}</div>
            <div class="small-muted" style="font-size:10.5px;">Truyện & sách</div>
          </div>
          <div class="gift-kpi">
            <div class="gift-kpi-label">Tiền quà</div>
            <div class="gift-kpi-val mono">${fmtMoney(totalSpentAll)}</div>
            <div class="small-muted" style="font-size:10.5px;">Tổng đã chi</div>
          </div>`;

        document.getElementById("merchStatusSummary").textContent =
          `Đã có ${totalOwnedAll} · Ship ${totalShipAll} · Săn ${totalHuntAll}`;

        const list = state.giftGroups.filter((g) => {
          if (filters.merchPub !== "Tất cả") {
            const known = ["Trẻ", "Kim Đồng", "IPM", "Nhã Nam"];
            if (filters.merchPub === "Khác") {
              if (known.includes(g.publisher)) return false;
            } else if (g.publisher !== filters.merchPub) {
              return false;
            }
          }
          if (q) {
            const giftNames = (g.gifts || []).map((it) => `${it.name} ${it.note || ""}`).join(" ");
            const hay = normVN(`${g.title} ${g.publisher} ${g.note || ""} ${giftNames}`);
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const filteredQty = list.reduce((a, g) => a + getGroupGiftStats(g).qty, 0);
        document.getElementById("merchCountLabel").textContent = `${list.length} bộ có quà · ${filteredQty} quà`;

        if (!list.length) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-title">${state.giftGroups.length ? "Không tìm thấy truyện/quà phù hợp" : "Chưa có manga hay sách có quà nào"}</div>
              <div class="empty-desc">Tạo từng đầu manga/sách có quà, rồi bấm vào để thêm tên quà, ảnh quà, số lượng và giá tiền.</div>
              ${state.giftGroups.length ? "" : `<button class="btn btn-primary" id="emptyAddGiftGroupBtn">+ Tạo truyện có quà đầu tiên</button>`}
            </div>`;
          const btn = document.getElementById("emptyAddGiftGroupBtn");
          if (btn) btn.addEventListener("click", () => openGiftGroupForm());
          return;
        }

        container.innerHTML = `<div class="merch-list">${list
          .map((g) => {
            const st = getGroupGiftStats(g);
            const firstGiftImg = (g.gifts || []).find((x) => resolveImg(x.image))?.image || "";
            const thumbSrc = resolveImg(g.cover) || resolveImg(firstGiftImg);
            return `
              <div class="gift-group-card" data-open-group="${g.id}">
                <div class="gift-group-thumb" style="border-left:2px solid ${pubColorVar(g.publisher)}">
                  ${thumbSrc ? `<img src="${esc(thumbSrc)}" alt="" loading="lazy" />` : `<span class="mono">${esc(g.publisher.slice(0, 3))}</span>`}
                </div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(g.title)}</div>
                  <div class="merch-meta" style="margin-top:5px;">
                    <span class="tag">${esc(g.publisher)}</span>
                    <span class="tag tag-accent mono">${st.qty} quà</span>
                    ${st.hunting ? `<span class="tag mono">Đang săn ${st.hunting}</span>` : ""}
                  </div>
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <div class="mono" style="font-size:13px; font-weight:600;">${fmtMoney(st.spent)}</div>
                  <div class="small-muted" style="margin-top:2px;">Mở →</div>
                </div>
              </div>`;
          })
          .join("")}</div>`;

        container.querySelectorAll("[data-open-group]").forEach((el) => {
          el.addEventListener("click", () => openGiftGroupDetail(el.dataset.openGroup));
        });
      }

      // Tạo / Sửa đầu Manga / Sách có quà
      function openGiftGroupForm(groupId = null) {
        const g = groupId ? state.giftGroups.find((x) => x.id === groupId) : null;
        let currentCover = resolveImg(g?.cover || "");

        // Gợi ý nhanh các đầu sách đang có trong Tủ sách (chưa tạo bên tab Quà)
        const existingTitles = new Set(state.giftGroups.map((x) => normVN(x.title)));
        const shelfSuggestions = !g
          ? state.series.filter((s) => !existingTitles.has(normVN(s.title))).slice(0, 8)
          : [];

        const html = `
          <form id="giftGroupForm" class="form-grid">
            ${
              shelfSuggestions.length
                ? `<div class="field">
                     <label>Chọn nhanh từ Tủ sách của bạn</label>
                     <div class="preset-chips">
                       ${shelfSuggestions
                         .map((s) => `<button type="button" class="preset-chip" data-pick-shelf="${s.id}">${esc(s.title.slice(0, 26))}</button>`)
                         .join("")}
                     </div>
                   </div>`
                : ""
            }
            <div class="field">
              <label>Tên manga / sách có quà *</label>
              <input name="title" id="ggTitleInput" required value="${esc(g?.title || "")}" placeholder="VD: Dungeon Meshi, Chainsaw Man, Rừng Na Uy..." />
            </div>
            <div class="field">
              <label>Nhà xuất bản</label>
              <select name="publisher" id="ggPubSelect">
                ${["Trẻ", "Kim Đồng", "IPM", "Nhã Nam", "Khác"]
                  .map((p) => `<option value="${p}" ${g?.publisher === p ? "selected" : ""}>${p}</option>`)
                  .join("")}
              </select>
            </div>
            <div class="field">
              <label>Ảnh đại diện bộ (tuỳ chọn)</label>
              <div class="cover-preview-wrap">
                <div class="cover-preview" id="ggCoverPreview">
                  ${currentCover ? `<img src="${esc(currentCover)}" alt="" />` : "Chưa có"}
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <label class="btn btn-sm" style="margin:0;">
                    ${currentCover ? "Đổi ảnh" : "Chọn ảnh"}
                    <input type="file" id="ggCoverInput" accept="image/*" style="display:none;" />
                  </label>
                  <button type="button" class="btn btn-sm btn-danger" id="clearGgCoverBtn" style="${currentCover ? "" : "display:none;"}">Xoá ảnh</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label>Ghi chú</label>
              <input name="note" value="${esc(g?.note || "")}" placeholder="VD: Bộ săn nhiều standee & postcard Fes..." />
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-sm" id="cancelGgBtn">Huỷ</button>
              <button type="submit" class="btn btn-sm btn-primary">${g ? "Lưu thay đổi" : "Tạo & thêm quà"}</button>
            </div>
          </form>`;

        openModal(g ? "Sửa truyện/sách có quà" : "Tạo manga / sách có quà", html, (body) => {
          const titleInput = body.querySelector("#ggTitleInput");
          const pubSel = body.querySelector("#ggPubSelect");
          const previewEl = body.querySelector("#ggCoverPreview");
          const clearBtn = body.querySelector("#clearGgCoverBtn");

          const setGgPreview = (url) => {
            currentCover = url || "";
            previewEl.innerHTML = currentCover ? `<img src="${esc(currentCover)}" alt="" />` : "Chưa có";
            clearBtn.style.display = currentCover ? "" : "none";
          };

          body.querySelectorAll("[data-pick-shelf]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const s = state.series.find((x) => x.id === btn.dataset.pickShelf);
              if (!s) return;
              titleInput.value = s.title;
              pubSel.value = s.publisher || "Khác";
              if (s.cover) setGgPreview(resolveImg(s.cover));
              showToast(`Đã điền từ Tủ sách: ${s.title}`);
            });
          });

          clearBtn.addEventListener("click", () => {
            setGgPreview("");
            showToast("Đã xoá ảnh.");
          });

          body.querySelector("#ggCoverInput").addEventListener("change", async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            try {
              const compressed = await compressImageFile(file, 320, 480, 0.74);
              setGgPreview(compressed);
            } catch {
              showToast("Không đọc được ảnh này.");
            }
          });

          body.querySelector("#cancelGgBtn").addEventListener("click", () => {
            if (g) openGiftGroupDetail(g.id);
            else closeModal();
          });

          body.querySelector("#giftGroupForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const title = fd.get("title").trim();
            if (!title) return;
            if (g) {
              g.title = title;
              g.publisher = fd.get("publisher");
              g.note = fd.get("note").trim();
              g.cover = currentCover;
              saveState();
              renderMerch();
              renderSpending();
              openGiftGroupDetail(g.id);
              showToast("Đã cập nhật.");
            } else {
              const newG = {
                id: uid(),
                title,
                publisher: fd.get("publisher"),
                cover: currentCover,
                note: fd.get("note").trim(),
                createdAt: todayISO(),
                gifts: [],
              };
              state.giftGroups.unshift(newG);
              saveState();
              renderMerch();
              openGiftGroupDetail(newG.id);
              showToast(`Đã tạo "${title}" — thêm các món quà vào đây nhé.`);
            }
          });
        });
      }

      // Chi tiết 1 Manga / Sách có quà: Thống kê số lượng quà + danh sách quà + thêm/sửa quà

        if (!g) return;
        const st = getGroupGiftStats(g);
        const shownGifts = (g.gifts || []).filter((it) => filterStatus === "Tất cả" || it.status === filterStatus);

          ? `<div class="merch-list" style="margin-top:8px;">${shownGifts
              .map((it) => {
                const qty = Math.max(1, Number(it.quantity) || 1);
                return `
                  <div class="merch-card">
                    ${
                      resolveImg(it.image)
                        ? `<button type="button" class="merch-thumb" data-zoom-gift="${it.id}" title="Xem ảnh lớn">
                             <img src="${esc(resolveImg(it.image))}" alt="${esc(it.name)}" loading="lazy" />
                           </button>`
                        : ""
                    }
                    <div class="merch-main" data-edit-gift="${it.id}" style="cursor:pointer;">

                        ${qty > 1 ? `<span class="tag tag-accent mono" style="margin-left:4px;">x${qty}</span>` : ""}
                      </div>
                      ${it.note ? `<div class="merch-sub">${esc(it.note)}</div>` : ""}
                      <div class="merch-meta">
                        <span class="tag">${esc(it.source)}</span>
                        <span class="small-muted mono">${esc(it.date || "")}</span>
                      </div>
                    </div>
                    <div class="merch-right">
                      <button type="button" class="status-cycle" data-cycle-gift="${it.id}" data-status="${esc(it.status)}">${esc(it.status)}</button>
                      <div class="mono" style="font-size:13px; font-weight:600;">${fmtMoney(it.price)}</div>
                    </div>
                  </div>`;
              })
              .join("")}</div>`
          : `<div class="empty" style="padding:18px; margin-top:8px;">
               <div class="empty-title" style="font-size:13px;">${(g.gifts || []).length ? "Không có quà ở trạng thái này" : "Chưa thêm món quà nào"}</div>
               <div class="empty-desc" style="margin-bottom:0;">Bấm <strong>+ Thêm quà</strong> để lưu tên quà, ảnh quà, số lượng và giá tiền.</div>
             </div>`;

        const html = `
          <div style="display:flex; gap:12px; align-items:flex-start;">
            <div class="cover-preview" style="width:56px; height:82px; border-left:3px solid ${pubColorVar(g.publisher)}">
              ${resolveImg(g.cover) ? `<img src="${esc(resolveImg(g.cover))}" alt="" />` : `<span class="mono" style="text-align:center; padding:3px;">${esc(g.publisher)}</span>`}
            </div>

      // ============================
      // TAB 3: TIN NXB (Mặc định CHỈ lọc theo tủ sách + chặn tin rác)
      // ============================
      const CLIENT_SPAM_KEYWORDS = [
        "ipmate",
        "ma giam gia",
        "voucher shopee",
        "voucher lazada",
        "black friday",
        "flash sale",
        "mega live",
        "tiktok shop",
        "creator tren tiktok",
        "group danh rieng cho cac creator",
        "tuyen dung",
        "thong bao nghi le",
        "bao tri he thong",
        "minigame",
        "giveaway",
      ];

      function isJunkNewsItem(item) {
        if (!item || item.manual) return false;
        const hay = normVN(`${item.title || ""} ${item.summary || ""}`);
        return CLIENT_SPAM_KEYWORDS.some((kw) => hay.includes(kw));
      }

      function extractSeriesKeywords(seriesObj) {
        const rawParts = [];
        if (seriesObj.title) {
          rawParts.push(seriesObj.title);
          // Tách tên Việt / Anh / phụ đề qua dấu —, –, -, :, /, ngoặc
          seriesObj.title.split(/[—–\-:\/()|]+/).forEach((p) => rawParts.push(p));
        }
        if (seriesObj.aliases) {
          seriesObj.aliases.split(/[,;|]+/).forEach((p) => rawParts.push(p));
        }

        const tokens = new Set();
        for (const part of rawParts) {
          let t = normVN(part);
          if (!t) continue;
          // Bỏ các hậu tố tập/phần/phiên bản để khớp rộng hơn
          t = t
            .replace(/\b(phan|tap|vol|volume|season|quyen|bo|boxset|ban dac biet|ban db|limited|tai ban)\s*\d*\b/g, "")
            .replace(/\s+/g, " ")
            .trim();
          if (t.length >= 3) tokens.add(t);
        }
        return [...tokens];
      }

      function findMatchedSeries(item) {
        if (!state.series.length) return null;
        const hay = normVN(
          `${item.title || ""} ${item.series || ""} ${item.summary || ""} ${item.gift || ""} ${item.searchText || ""}`
        );
        if (!hay) return null;
        const paddedHay = ` ${hay} `;

        for (const s of state.series) {
          const keywords = extractSeriesKeywords(s);
          for (const kw of keywords) {
            if (kw.length <= 4) {
              // Từ khoá ngắn (VD: jojo, orv, opm) bắt buộc khớp nguyên từ để tránh trùng nhầm
              if (paddedHay.includes(` ${kw} `)) return s;
            } else {
              if (hay.includes(kw)) return s;
            }
          }
        }
        return null;
      }

      function matchesUserShelf(item) {
        return Boolean(findMatchedSeries(item));
      }

      async function fetchNews(manual = false) {
        const titleEl = document.getElementById("newsSyncTitle");
        const metaEl = document.getElementById("newsSyncMeta");
        const srcUrl = state.newsUrl || "./news.json";
        titleEl.textContent = "Đang tải tin 4 NXB...";
        metaEl.textContent = `Nguồn: ${srcUrl}`;

        try {
          const sep = srcUrl.includes("?") ? "&" : "?";
          const res = await fetch(`${srcUrl}${sep}t=${Date.now()}`, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const rawList = Array.isArray(data) ? data : Array.isArray(data.items) ? data.items : [];
          // Lọc sạch tin rác ngay phía client (phòng trường hợp news.json cũ còn sót)
          newsItems = rawList.filter((it) => !isJunkNewsItem(it));
          newsMeta = {
            updatedAt: data.updatedAt || "",
            loaded: true,
            error: "",
          };
          const timeStr = newsMeta.updatedAt
            ? new Date(newsMeta.updatedAt).toLocaleString("vi-VN", { hour12: false })
            : "Vừa xong";
          metaEl.textContent = `Cập nhật: ${timeStr}`;
          if (manual) showToast("Đã cập nhật dữ liệu tin 4 NXB.");
        } catch (err) {
          newsMeta = { updatedAt: "", loaded: false, error: err.message };
          titleEl.textContent = "Chưa kết nối được file tin";
          metaEl.textContent =
            location.protocol === "file:"
              ? "Đang mở file offline — đẩy lên GitHub Pages để bot tự cập nhật."
              : `Lỗi tải ${srcUrl} (${err.message})`;
          if (manual) showToast("Chưa tải được news.json.");
        }
        renderNews();
      }

      function countdownText(dateStr) {
        if (!dateStr) return "";
        const target = new Date(dateStr + "T00:00:00");
        if (isNaN(target.getTime())) return dateStr;
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diff = Math.round((target - now) / 86400000);
        if (diff > 0) return `${dateStr} (còn ${diff} ngày)`;
        if (diff === 0) return `${dateStr} (hôm nay)`;
        return dateStr;
      }

      function renderNews() {
        const container = document.getElementById("newsContainer");
        const titleEl = document.getElementById("newsSyncTitle");

        const manualPins = state.pinned
          .filter((p) => p.manual)
          .map((p) => ({
            id: p.id,
            publisher: p.publisher,
            type: p.type,
            channel: p.channel || "Ghim tay",
            title: p.title,
            series: p.series || "",
            summary: p.note || "",
            gift: p.gift || "",
            releaseDate: p.releaseDate || "",
            price: p.estPrice || 0,
            url: p.url || "",
            image: "",
            manual: true,
          }));

        const combined = [...manualPins, ...newsItems];
        const shelfMatchedList = combined.filter((it) => it.manual || matchesUserShelf(it));

        // Cập nhật số đếm trên 2 tab chuyển chế độ + chấm thông báo đỏ CHỈ khi có tin khớp tủ
        const shelfCountEl = document.getElementById("scopeShelfCount");
        const allCountEl = document.getElementById("scopeAllCount");
        if (shelfCountEl) shelfCountEl.textContent = `(${shelfMatchedList.length})`;
        if (allCountEl) allCountEl.textContent = `(${combined.length})`;

        const autoShelfMatchedCount = newsItems.filter((it) => matchesUserShelf(it)).length;
        document.getElementById("newsDot").classList.toggle("show", autoShelfMatchedCount > 0);

        if (newsMeta.loaded) {
          titleEl.textContent = state.series.length
            ? `${autoShelfMatchedCount} tin khớp tủ · ${newsItems.length} tin sạch từ 4 NXB`
            : `Chưa có sách trong tủ · Đã quét ${newsItems.length} tin 4 NXB`;
        }

        const baseList = filters.newsScope === "shelf" ? shelfMatchedList : combined;

        const filtered = baseList.filter((it) => {
          if (filters.newsPub !== "Tất cả" && it.publisher !== filters.newsPub) return false;
          if (filters.newsType !== "Tất cả" && it.type !== filters.newsType) return false;
          if (filters.newsChan !== "Tất cả" && it.channel !== filters.newsChan) return false;
          return true;
        });

        if (!filtered.length) {
          if (filters.newsScope === "shelf" && !state.series.length) {
            container.innerHTML = `
              <div class="empty">
                <div class="empty-title">Tủ sách đang trống</div>
                <div class="empty-desc">
                  Tab này mặc định chỉ hiện tin tập mới, tái bản, quà kèm và Fes liên quan đến <strong>truyện & sách bạn đang có</strong>. Thêm sách vào tủ trước để app tự lọc tin cho bạn.
                </div>
                <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                  <button class="btn btn-sm btn-primary" id="emptyGoAddBook">+ Thêm bộ vào tủ</button>
                  <button class="btn btn-sm" id="emptySwitchAll">Xem tất cả tin 4 NXB</button>
                </div>
              </div>`;
            container.querySelector("#emptyGoAddBook").addEventListener("click", () => {
              document.querySelector('.tab-btn[data-tab="books"]').click();
              openSeriesForm();
            });
            container.querySelector("#emptySwitchAll").addEventListener("click", () => {
              document.getElementById("scopeAllBtn").click();
            });
            return;
          }

          if (filters.newsScope === "shelf" && state.series.length) {
            container.innerHTML = `
              <div class="empty">
                <div class="empty-title">Chưa có tin mới liên quan tới tủ của bạn</div>
                <div class="empty-desc">
                  Hiện chưa có bài mới nào từ Trẻ, Kim Đồng, IPM, Nhã Nam nhắc tới ${state.series.length} đầu sách trong tủ. Mẹo: vào sửa bộ sách và điền thêm <strong>Tên khác / từ khoá</strong> (VD: tên tiếng Anh/Nhật) nếu NXB hay dùng tên khác.
                </div>
                <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                  <button class="btn btn-sm" id="emptySwitchAll2">Xem tất cả tin 4 NXB</button>
                  <button class="btn btn-sm" id="emptyManualPin">+ Tự ghim lịch săn</button>
                </div>
              </div>`;
            container.querySelector("#emptySwitchAll2").addEventListener("click", () => {
              document.getElementById("scopeAllBtn").click();
            });
            container.querySelector("#emptyManualPin").addEventListener("click", openManualPinForm);
            return;
          }

          container.innerHTML = `
            <div class="empty">
              <div class="empty-title">${combined.length ? "Không có tin khớp bộ lọc" : "Chưa có tin từ 4 NXB"}</div>
              <div class="empty-desc">${
                combined.length
                  ? "Thử chọn lại NXB, loại tin hoặc kênh khác."
                  : "Vào tab Actions trên GitHub bấm Run workflow để bot kéo tin mới từ 4 NXB."
              }</div>
              <button class="btn btn-sm" id="emptyManualPin">+ Tự ghim lịch săn</button>
            </div>`;
          const btn = document.getElementById("emptyManualPin");
          if (btn) btn.addEventListener("click", openManualPinForm);
          return;
        }

        const pinnedIds = new Set(state.pinned.map((p) => p.id));

        container.innerHTML = `<div class="news-list">${filtered
          .map((it) => {
            const matchedSeries = findMatchedSeries(it);
            const isPinned = pinnedIds.has(it.id);
            const cd = countdownText(it.releaseDate);
            return `
              <article class="news-card ${matchedSeries ? "matched" : ""}">
                <div class="news-head">
                  <span class="tag" style="border-left:2px solid ${pubColorVar(it.publisher)}">${esc(it.publisher)}</span>
                  <span class="tag ${typeTagClass(it.type)}">${typeLabel(it.type)}</span>
                  <span class="tag mono">${esc(it.channel || "Web")}</span>
                  ${matchedSeries ? `<span class="tag tag-accent">Khớp: ${esc(matchedSeries.title.slice(0, 26))}</span>` : ""}
                  ${cd ? `<span class="small-muted mono" style="margin-left:auto;">${esc(cd)}</span>` : ""}
                </div>
                <div class="news-body">
                  <div class="news-text">
                    <h3 class="news-title">${esc(it.title)}</h3>
                    ${it.summary ? `<p class="news-summary">${esc(it.summary)}</p>` : ""}
                    ${it.price ? `<div class="mono small-muted" style="margin-top:5px;">Giá dự kiến: ${fmtMoney(it.price)}</div>` : ""}
                  </div>
                  ${it.image ? `<img class="news-thumb" src="${esc(it.image)}" alt="" loading="lazy" onerror="this.style.display='none'" />` : ""}
                </div>
                ${it.gift ? `<div class="news-gift"><strong>Quà / Kèm:</strong> ${esc(it.gift)}</div>` : ""}
                <div class="news-actions">
                  <button class="btn btn-sm ${isPinned ? "btn-accent" : ""}" data-pin="${esc(it.id)}">
                    ${isPinned ? "Đã ghim dự chi" : "Ghim dự chi"}
                  </button>
                  <button class="btn btn-sm" data-import-news="${esc(it.id)}">Đã mua → Vào tủ</button>
                  ${
                    it.url
                      ? `<a class="btn btn-sm" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" style="margin-left:auto;">Xem gốc</a>`
                      : ""
                  }
                </div>
              </article>`;
          })
          .join("")}</div>`;

        container.querySelectorAll("[data-pin]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.pin;
            const existing = state.pinned.find((p) => p.id === id);
            if (existing) {
              state.pinned = state.pinned.filter((p) => p.id !== id);
              saveState();
              renderNews();
              renderSpending();
              showToast("Đã bỏ ghim.");
              return;
            }
            const item = combined.find((x) => x.id === id);
            if (!item) return;
            state.pinned.unshift({
              id: item.id,
              title: item.title,
              publisher: item.publisher,
              type: item.type,
              channel: item.channel,
              releaseDate: item.releaseDate || "",
              estPrice: Number(item.price) || 0,
              gift: item.gift || "",
              url: item.url || "",
              manual: false,
            });
            saveState();
            renderNews();
            renderSpending();
            showToast("Đã ghim vào Dự chi.");
          });
        });

        container.querySelectorAll("[data-import-news]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const item = combined.find((x) => x.id === btn.dataset.importNews);
            if (item) openQuickImportFromNews(item);
          });

              <button type="submit" class="btn btn-sm btn-primary">Xác nhận nhập kho</button>
            </div>
          </form>`;

        openModal("Đã mua → Nhập kho nhanh", html, (body) => {
          const targetSel = body.querySelector("#qiTarget");
          const bookExtra = body.querySelector("#qiBookExtra");
          const giftNameWrap = body.querySelector("#qiGiftNameWrap");
          const nameLabel = body.querySelector("#qiNameLabel");

          const toggleExtra = () => {
            const isBook = targetSel.value === "book";
            bookExtra.style.display = isBook ? "grid" : "none";
            giftNameWrap.style.display = isBook ? "none" : "";
            nameLabel.textContent = isBook ? "Tên bộ truyện / sách *" : "Thuộc truyện / sách có quà *";
          };
          targetSel.addEventListener("change", toggleExtra);
          toggleExtra();

          body.querySelector("#qiCancel").addEventListener("click", closeModal);
          body.querySelector("#quickImportForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const name = fd.get("name").trim();
            const coverPrice = Math.max(0, Number(fd.get("coverPrice")) || 0);
            const paidPrice = Math.max(0, Number(fd.get("paidPrice")) || 0);

            if (fd.get("target") === "book") {
              let existing = state.series.find((s) => normVN(s.title) === normVN(name));
              if (!existing) {
                existing = {
                  id: uid(),
                  title: name,
                  publisher: item.publisher || "Khác",
                  category: "Manga",
                  status: "Đang theo",
                  aliases: "",
                  note: "",
                  cover: "",
                  sections: [],
                  createdAt: todayISO(),
                };
                state.series.unshift(existing);
              }
              const secName = (fd.get("sectionName") || "Bản thường").trim();
              existing.sections = existing.sections || [];
              let sec = existing.sections.find((x) => normVN(x.name) === normVN(secName));
              if (!sec) {
                sec = { id: uid(), name: secName, note: "", volumes: [] };
                existing.sections.push(sec);
              }
              const f = Number(fd.get("volFrom")) || 1;
              const rawTo = (fd.get("volTo") || "").trim();
              if (rawTo && Number(rawTo) > f) {
                addBatchVolumesToSection(sec, {
                  from: f,
                  to: Number(rawTo),
                  priceMode: "total",
                  coverInput: coverPrice,
                  paidInput: paidPrice,
                  discount: 0,
                  date: todayISO(),
                  image: "",
                  note: item.gift ? `Quà: ${item.gift}` : "",
                });
              } else {
                sec.volumes.push({
                  id: uid(),
                  number: f,
                  coverPrice,
                  paidPrice,
                  date: todayISO(),
                  image: "",
                  note: item.gift ? `Quà: ${item.gift}` : "",
                });
              }
              showToast(`Đã nhập "${name}" (${secName}) vào Tủ sách.`);
            } else {
              let group = state.giftGroups.find((g) => normVN(g.title) === normVN(name));
              if (!group) {
                const matchedS = state.series.find((s) => normVN(s.title) === normVN(name));
                group = {
                  id: uid(),
                  title: name,
                  publisher: item.publisher || matchedS?.publisher || "Khác",
                  cover: matchedS?.cover || "",
                  note: "",
                  createdAt: todayISO(),
                  gifts: [],
                };
                state.giftGroups.unshift(group);
              }
              const gName = (fd.get("giftName") || item.gift || item.title).trim();
              group.gifts.unshift({
                id: uid(),
                name: gName,
                quantity: 1,
                price: paidPrice,
                source: item.type === "fes" ? "Săn tại Fes" : "Kèm bản ĐB",
                status: "Đã có",
                date: todayISO(),
                image: "",
                note: "",
              });
              showToast(`Đã nhập quà "${gName}" vào "${name}".`);
            }
            state.pinned = state.pinned.filter((p) => p.id !== item.id);
            saveState();
            renderBooks();
            renderMerch();
            renderNews();
            renderSpending();
            closeModal();
          });
        });
      }

      function renderSpending() {
        let bookPaid = 0;
        let bookCover = 0;
        let merchPaid = 0;
        const pubTotals = { Trẻ: 0, "Kim Đồng": 0, IPM: 0, "Nhã Nam": 0, Khác: 0 };
        const catTotals = { Manga: 0, "Light Novel": 0, Sách: 0, Artbook: 0, "Quà & Đồ": 0 };
        const monthTotals = {};

        const now = new Date();
        const currentYM = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const last6Months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          last6Months.push(ym);
          monthTotals[ym] = 0;
        }

        state.series.forEach((s) => {
          const pubKey = pubTotals.hasOwnProperty(s.publisher) ? s.publisher : "Khác";
          const catKey = catTotals.hasOwnProperty(s.category) ? s.category : "Sách";
          getAllSeriesVolumes(s).forEach((v) => {
            const p = Number(v.paidPrice) || 0;
            const c = Number(v.coverPrice) || 0;
            bookPaid += p;
            bookCover += c;
            pubTotals[pubKey] += p;
            catTotals[catKey] += p;
            const ym = (v.date || "").slice(0, 7);
            if (monthTotals.hasOwnProperty(ym)) monthTotals[ym] += p;
          });
        });

        state.giftGroups.forEach((g) => {
          const pubKey = pubTotals.hasOwnProperty(g.publisher) ? g.publisher : "Khác";
          (g.gifts || []).forEach((m) => {
            const p = Number(m.price) || 0;
            merchPaid += p;
            pubTotals[pubKey] += p;
            catTotals["Quà & Đồ"] += p;
            const ym = (m.date || "").slice(0, 7);
            if (monthTotals.hasOwnProperty(ym)) monthTotals[ym] += p;
          });
        });

        const totalPaid = bookPaid + merchPaid;
        const savedDiff = bookCover - bookPaid;
        const pinnedTotal = state.pinned.reduce((a, p) => a + (Number(p.estPrice) || 0), 0);

        document.getElementById("spendingKpis").innerHTML = `
          <div class="kpi-card">
            <div class="kpi-label">Tổng thực chi</div>
            <div class="kpi-val mono">${fmtMoney(totalPaid)}</div>
            <div class="kpi-sub">Sách ${fmtMoney(bookPaid)} · Quà ${fmtMoney(merchPaid)}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Tổng giá bìa</div>
            <div class="kpi-val mono">${fmtMoney(bookCover)}</div>
            <div class="kpi-sub">Chỉ tính sách & truyện</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">${savedDiff >= 0 ? "Tiết kiệm sale" : "Chênh mua hiếm"}</div>
            <div class="kpi-val mono" style="color:${savedDiff >= 0 ? "var(--forest)" : "var(--accent)"}">
              ${savedDiff >= 0 ? "-" : "+"}${fmtMoney(Math.abs(savedDiff))}
            </div>
            <div class="kpi-sub">So với giá bìa</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Dự chi đang ghim</div>
            <div class="kpi-val mono">${fmtMoney(pinnedTotal)}</div>
            <div class="kpi-sub">${state.pinned.length} mục chờ săn</div>
          </div>`;

        // Budget month
        const thisMonthSpent = monthTotals[currentYM] || 0;
        const limit = Number(state.budgetLimit) || 1000000;
        const pct = Math.min(100, Math.round((thisMonthSpent / Math.max(1, limit)) * 100));
        document.getElementById("budgetMonthTitle").textContent = `Hạn mức tháng ${currentYM.slice(5)}/${currentYM.slice(0, 4)}`;
        document.getElementById("budgetSpentText").textContent = fmtMoney(thisMonthSpent);
        document.getElementById("budgetLimitText").textContent = `/ ${fmtMoney(limit)}`;
        const bar = document.getElementById("budgetBar");
        bar.style.width = `${pct}%`;
        bar.classList.toggle("over", thisMonthSpent > limit);
        document.getElementById("budgetNote").textContent =
          thisMonthSpent > limit
            ? `Đã vượt hạn mức tháng ${fmtMoney(thisMonthSpent - limit)}.`
            : `Còn dư ${fmtMoney(limit - thisMonthSpent)} trong tháng này (${pct}%).`;

        // Helper for flat bar lists
        function renderBars(elId, entries) {
          const max = Math.max(...entries.map(([, v]) => v), 1);
          document.getElementById(elId).innerHTML = entries
            .map(
              ([label, val]) => `
            <div class="bar-row">
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(label)}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.round((val / max) * 100)}%"></div></div>
              <span class="bar-val mono">${fmtMoney(val)}</span>
            </div>`
            )
            .join("");
        }

        renderBars(
          "chartMonths",
          last6Months.map((ym) => [`T${ym.slice(5)}/${ym.slice(2, 4)}`, monthTotals[ym]])
        );
        renderBars("chartPublishers", Object.entries(pubTotals));
        renderBars("chartCategories", Object.entries(catTotals));

        // Pinned watchlist
        document.getElementById("pinnedTotalLabel").textContent = fmtMoney(pinnedTotal);
        const pinContainer = document.getElementById("pinnedListContainer");
        if (!state.pinned.length) {
          pinContainer.innerHTML = `<div class="small-muted">Chưa ghim mục nào. Vào tab Tin NXB bấm "Ghim dự chi" để theo dõi.</div>`;
        } else {
          pinContainer.innerHTML = state.pinned
            .map(
              (p) => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);">
              <div style="min-width:0;">
                <div style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(p.title)}</div>
                <div class="small-muted mono">${esc(p.publisher)} ${p.releaseDate ? `· ${esc(p.releaseDate)}` : ""}</div>
              </div>
              <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                <button class="btn btn-sm mono" data-edit-pin-price="${esc(p.id)}">${fmtMoney(p.estPrice)}</button>
                <button class="btn btn-sm" data-unpin="${esc(p.id)}">Bỏ</button>
              </div>
            </div>`
            )
            .join("");

          pinContainer.querySelectorAll("[data-edit-pin-price]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const p = state.pinned.find((x) => x.id === btn.dataset.editPinPrice);
              if (!p) return;
              const val = prompt(`Nhập số tiền dự chi (VNĐ) cho "${p.title}":`, String(p.estPrice || 0));
              if (val === null) return;
              p.estPrice = Math.max(0, Number(val.replace(/[^\d]/g, "")) || 0);
              saveState();
              renderSpending();
            });
          });
          pinContainer.querySelectorAll("[data-unpin]").forEach((btn) => {
            btn.addEventListener("click", () => {
              state.pinned = state.pinned.filter((x) => x.id !== btn.dataset.unpin);
              saveState();
              renderNews();
              renderSpending();
            });
          });
        }
      }
