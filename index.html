<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tủ Sách" />
  <meta name="theme-color" content="#F6F5F1" id="metaThemeColor" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>Tủ Sách — Manga, Sách & Quà</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F5F1;
      --surface: #FFFFFF;
      --surface-2: #EFECE4;
      --ink: #1C1B19;
      --muted: #6E6A63;
      --line: #DCD8CE;
      --line-strong: #B9B3A6;
      --accent: #9E472A;
      --accent-soft: #F5E8E3;
      --forest: #2F5D50;
      --forest-soft: #E5EFEA;
      --amber: #8F6424;
      --amber-soft: #F4ECDF;
      --danger: #A63229;
      --pub-tre: #A83A2F;
      --pub-kim: #2E5278;
      --pub-ipm: #2F5D50;
      --pub-nn: #8F6424;
      --pub-other: #5E5B55;
      --radius: 2px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #141312;
      --surface: #1C1A18;
      --surface-2: #25221F;
      --ink: #EDEAE3;
      --muted: #989288;
      --line: #2F2C28;
      --line-strong: #49443D;
      --accent: #CE6E4E;
      --accent-soft: #2D1E19;
      --forest: #62A08D;
      --forest-soft: #1B2A25;
      --amber: #CCA05C;
      --amber-soft: #2A2318;
      --danger: #D86259;
      --pub-tre: #CE6459;
      --pub-kim: #6994C2;
      --pub-ipm: #62A08D;
      --pub-nn: #CCA05C;
      --pub-other: #8A847A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overscroll-behavior-y: none;
    }

    .mono {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      font-size: 16px; /* Prevent iOS Safari auto-zoom */
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Layout Shell */
    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(68px + var(--safe-bottom));
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + var(--safe-top)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-meta {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      height: 32px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn:active {
      background: var(--surface-2);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    /* Main Content */
    .main {
      padding: 14px 16px 24px;
      flex: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* Toolbar & Filters */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--ink);
    }

    .btn {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:active {
      background: var(--surface-2);
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-accent {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
      background: transparent;
    }

    .btn-sm {
      height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .chip.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .chip.accent-active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Section header row */
    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .seg button {
      height: 26px;
      padding: 0 9px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface);
      color: var(--muted);
    }

    .seg button + button {
      border-left: 1px solid var(--line);
    }

    .seg button.active {
      background: var(--ink);
      color: var(--bg);
    }

    /* Books Grid */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 10px;
    }

    @media (min-width: 640px) {
      .book-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px 14px;
      }
    }

    @media (min-width: 840px) {
      .book-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    .book-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .book-cover {
      position: relative;
      aspect-ratio: 2 / 3;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .typo-cover {
      padding: 10px 9px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 3px solid var(--pub-other);
    }

    .typo-pub {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .typo-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .typo-cat {
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 6px;
    }

    .cover-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(20, 19, 18, 0.84);
      color: #F6F5F1;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 1px;
    }

    .book-info {
      padding-top: 6px;
    }

    .book-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-meta {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    /* Books List */
    .book-list {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .book-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .book-row:last-child {
      border-bottom: none;
    }

    .book-row:active {
      background: var(--surface-2);
    }

    .row-thumb {
      width: 38px;
      height: 54px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
    }

    .row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tags & Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 1px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface-2);
      white-space: nowrap;
    }

    .tag-accent {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .tag-forest {
      border-color: var(--forest);
      color: var(--forest);
      background: var(--forest-soft);
    }

    .tag-amber {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-soft);
    }

    /* Volume Matrix */
    .vol-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
      margin: 12px 0;
    }

    .vol-cell {
      position: relative;
      height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .vol-cell:active {
      background: var(--surface-2);
    }

    .vol-cell .vol-sub {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1;
      margin-top: 2px;
    }

    .vol-cell.ed-special::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      border-top: 9px solid var(--accent);
      border-left: 9px solid transparent;
    }

    .vol-cell.ed-reprint::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      background: var(--forest);
    }

    .vol-cell.ed-boxset {
      border-color: var(--ink);
      border-width: 1.5px;
    }

    /* Merch Cards */
    .merch-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .merch-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .merch-main {
      min-width: 0;
      flex: 1;
    }

    .merch-title {
      font-size: 13.5px;
      font-weight: 600;
    }

    .merch-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .merch-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
      align-items: center;
    }

    .merch-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-cycle {
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-2);
    }

    .status-cycle[data-status="Đã có"] {
      border-color: var(--forest);
      color: var(--forest);
      background: var(--forest-soft);
    }

    .status-cycle[data-status="Đang ship"] {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-soft);
    }

    .status-cycle[data-status="Đang săn"] {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* News Feed */
    .news-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 10px;
      font-size: 12px;
    }

    .scope-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .scope-switch button {
      height: 34px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .scope-switch button + button {
      border-left: 1px solid var(--line);
    }

    .scope-switch button.active {
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .news-card.matched {
      border-left: 3px solid var(--accent);
    }

    .news-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .news-body {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .news-text {
      flex: 1;
      min-width: 0;
    }

    .news-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 5px;
    }

    .news-summary {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0;
      line-height: 1.45;
    }

    .news-thumb {
      width: 62px;
      height: 82px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
    }

    .news-gift {
      margin-top: 8px;
      padding: 6px 8px;
      border-left: 2px solid var(--amber);
      background: var(--amber-soft);
      font-size: 12px;
    }

    .news-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }

    /* Spending Dashboard */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-val {
      font-size: 17px;
      font-weight: 600;
      margin-top: 4px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--ink);
      transition: width 0.2s ease;
    }

    .progress-fill.over {
      background: var(--danger);
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 84px 1fr 78px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .bar-track {
      height: 10px;
      background: var(--surface-2);
    }

    .bar-fill {
      height: 100%;
      background: var(--ink);
    }

    .bar-val {
      text-align: right;
      font-size: 11.5px;
      color: var(--muted);
    }

    /* Empty State */
    .empty {
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 5px;
    }

    .empty-desc {
      font-size: 12.5px;
      max-width: 380px;
      margin: 0 auto 14px;
    }

    /* Bottom Tab Bar */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding-bottom: var(--safe-bottom);
    }

    .tabbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 54px;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      position: relative;
    }

    .tab-btn.active {
      color: var(--ink);
      font-weight: 600;
    }

    .tab-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 2px;
      background: var(--accent);
    }

    .tab-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    .tab-dot {
      position: absolute;
      top: 7px;
      right: calc(50% - 14px);
      width: 6px;
      height: 6px;
      background: var(--accent);
      display: none;
    }

    .tab-dot.show {
      display: block;
    }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 14, 12, 0.52);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 540px;
      max-height: 90dvh;
      background: var(--bg);
      border-top: 1px solid var(--line-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      .modal {
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
      }
    }

    .modal-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-body {
      padding: 14px 16px calc(18px + var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 11px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      outline: none;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--ink);
    }

    .field textarea {
      min-height: 68px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .cover-preview-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cover-preview {
      width: 56px;
      height: 84px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .cover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .merch-thumb {
      width: 58px;
      height: 58px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-2);
      overflow: hidden;
      flex-shrink: 0;
      cursor: zoom-in;
    }

    .merch-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .merch-preview {
      width: 72px;
      height: 72px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .merch-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-zoom-wrap {
      text-align: center;
    }

    .img-zoom-wrap img {
      max-width: 100%;
      max-height: 62dvh;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    /* Sections inside a Series */
    .section-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }

    .section-card {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-card:active {
      background: var(--surface-2);
    }

    .sec-thumb {
      width: 44px;
      height: 60px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface-2);
      overflow: hidden;
      flex-shrink: 0;
      cursor: zoom-in;
      padding: 0;
      display: block;
    }

    .sec-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .quick-box {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 10px 11px;
    }

    .quick-box-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .quick-box-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .bulk-textarea {
      width: 100%;
      min-height: 150px;
      padding: 9px 10px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13.5px;
      line-height: 1.55;
      outline: none;
      resize: vertical;
    }

    .bulk-textarea:focus {
      border-color: var(--ink);
    }

    .section-card-title {
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-card-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .section-arrow {
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .preset-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .preset-chip {
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 500;
    }

    .preset-chip:active {
      background: var(--ink);
      color: var(--bg);
    }

    /* Volume Cards (supports photo + price per volume) */
    .vol-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin: 12px 0;
    }

    @media (min-width: 520px) {
      .vol-card-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .vol-card {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: left;
      padding: 0;
    }

    .vol-card:active {
      background: var(--surface-2);
    }

    .vol-card-media {
      position: relative;
      aspect-ratio: 2 / 3;
      width: 100%;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }

    .vol-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .vol-card-num-big {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
    }

    .vol-card-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(20, 19, 18, 0.85);
      color: #F6F5F1;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 1px;
    }

    .vol-card-body {
      padding: 5px 6px;
      width: 100%;
    }

    .vol-card-label {
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vol-card-price {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Gift Groups (Tab Quà & Đồ) */
    .gift-kpi-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .gift-kpi {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 10px;
    }

    .gift-kpi-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .gift-kpi-val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 3px;
    }

    .gift-group-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .gift-group-card:active {
      background: var(--surface-2);
    }

    .gift-group-thumb {
      width: 44px;
      height: 62px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .gift-group-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .crumb-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .scope-switch-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 8px;
      overflow: hidden;
    }

    .scope-switch-3 button {
      height: 33px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .scope-switch-3 button + button {
      border-left: 1px solid var(--line);
    }

    .scope-switch-3 button.active {
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }

    .sort-select {
      height: 26px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 11.5px;
      outline: none;
    }

    .save-status {
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
    }

    .save-status.saving {
      color: var(--amber);
    }

    .save-status.error {
      color: var(--danger);
      font-weight: 600;
    }

    .ck-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .ck-btn {
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 500;
    }

    .ck-btn.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .ck-meta {
      font-size: 11.5px;
      color: var(--forest);
      margin-top: 5px;
    }

    .missing-strip {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--amber);
      border-left: 3px solid var(--amber);
      background: var(--amber-soft);
      border-radius: var(--radius);
      font-size: 12px;
    }

    .missing-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .missing-chip {
      height: 24px;
      padding: 0 8px;
      border: 1px dashed var(--amber);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 600;
    }

    .vol-flag {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(20, 19, 18, 0.84);
      color: #F6F5F1;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 1px;
      max-width: calc(100% - 8px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vol-flag.seal {
      background: var(--forest);
    }

    .vol-flag.lent {
      background: var(--accent);
    }

    .vol-compact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 6px;
      margin: 12px 0;
    }

    .vol-compact-cell {
      position: relative;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .vol-compact-cell:active {
      background: var(--surface-2);
    }

    .vol-compact-cell.is-lent {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .vol-compact-cell.is-seal {
      border-color: var(--forest);
    }

    .vol-compact-num {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
    }

    .vol-compact-price {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .boxset-hint {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-left: 2px solid var(--ink);
      background: var(--surface-2);
      font-size: 12px;
      color: var(--ink);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(68px + var(--safe-bottom));
      transform: translateX(-50%);
      z-index: 80;
      background: var(--ink);
      color: var(--bg);
      padding: 8px 14px;
      font-size: 12.5px;
      border-radius: var(--radius);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 12px 0;
    }

    .small-muted {
      font-size: 11.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Tủ Sách</div>
        <div class="brand-meta mono" id="headerSummary">Đang tải...</div>
        <span class="save-status mono" id="saveIndicator"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="Đổi giao diện">
          <span id="themeLabel">Đèn bàn</span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Cài đặt & Sao lưu">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- TAB 1: TỦ SÁCH -->
      <section class="view active" id="view-books">
        <div class="scope-switch-3" id="bookGroupSwitch">
          <button class="active" data-group="all">Tất cả <span class="mono" id="cntAllBooks">(0)</span></button>
          <button data-group="truyen">Truyện <span class="mono" id="cntTruyen">(0)</span></button>
          <button data-group="sach">Sách <span class="mono" id="cntSach">(0)</span></button>
        </div>

        <div class="toolbar">
          <input type="search" class="search-input" id="bookSearch" placeholder="Tìm tên truyện, sách, NXB..." />
          <button class="btn btn-primary" id="addSeriesBtn">+ Thêm bộ</button>
        </div>

        <div class="chip-row" id="bookCatChips">
          <button class="chip active" data-cat="Tất cả">Mọi loại</button>
          <button class="chip" data-cat="Manga">Manga</button>
          <button class="chip" data-cat="Light Novel">Light Novel</button>
          <button class="chip" data-cat="Artbook">Artbook</button>
          <button class="chip" data-cat="Sách">Sách chữ</button>
        </div>

        <div class="chip-row" id="bookPubChips">
          <button class="chip active" data-pub="Tất cả">Mọi NXB</button>
          <button class="chip" data-pub="Trẻ">Trẻ</button>
          <button class="chip" data-pub="Kim Đồng">Kim Đồng</button>
          <button class="chip" data-pub="IPM">IPM</button>
          <button class="chip" data-pub="Nhã Nam">Nhã Nam</button>
          <button class="chip" data-pub="Khác">Khác</button>
        </div>

        <div class="subbar">
          <span class="mono" id="bookCountLabel">0 đầu sách</span>
          <div style="display:flex; align-items:center; gap:6px;">
            <select class="sort-select" id="bookSortSel" title="Sắp xếp">
              <option value="recent">Mới thêm</option>
              <option value="name">Tên A–Z</option>
              <option value="vols">Nhiều tập</option>
              <option value="spent">Chi nhiều</option>
            </select>
            <div class="seg" id="bookViewSeg">
              <button class="active" data-mode="grid">Lưới</button>
              <button data-mode="list">Dòng</button>
            </div>
          </div>
        </div>

        <div id="booksContainer"></div>
      </section>

      <!-- TAB 2: QUÀ & ĐỒ -->
      <section class="view" id="view-merch">
        <div class="gift-kpi-row" id="giftSummaryKpis"></div>

        <div class="toolbar">
          <input type="search" class="search-input" id="merchSearch" placeholder="Tìm truyện/sách có quà hoặc tên quà..." />
          <button class="btn btn-primary" id="addGiftGroupBtn">+ Truyện có quà</button>
        </div>

        <div class="chip-row" id="merchPubChips">
          <button class="chip active" data-pub="Tất cả">Mọi NXB</button>
          <button class="chip" data-pub="Trẻ">Trẻ</button>
          <button class="chip" data-pub="Kim Đồng">Kim Đồng</button>
          <button class="chip" data-pub="IPM">IPM</button>
          <button class="chip" data-pub="Nhã Nam">Nhã Nam</button>
          <button class="chip" data-pub="Khác">Khác</button>
        </div>

        <div class="subbar">
          <span class="mono" id="merchCountLabel">0 bộ có quà · 0 quà</span>
          <span class="small-muted" id="merchStatusSummary">Đã có 0 · Đang ship 0 · Đang săn 0</span>
        </div>

        <div id="merchContainer"></div>
      </section>

      <!-- TAB 3: TIN NXB -->
      <section class="view" id="view-news">
        <div class="news-status-bar">
          <div>
            <div style="font-weight:600;" id="newsSyncTitle">Đang kiểm tra nguồn tin...</div>
            <div class="small-muted mono" id="newsSyncMeta">Nguồn: ./news.json</div>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="btn btn-sm" id="manualPinBtn">+ Ghim tay</button>
            <button class="btn btn-sm" id="refreshNewsBtn">Làm mới</button>
          </div>
        </div>

        <div class="scope-switch" id="newsScopeSwitch">
          <button class="active" data-scope="shelf" id="scopeShelfBtn">Theo tủ của tôi <span class="mono" id="scopeShelfCount">(0)</span></button>
          <button data-scope="all" id="scopeAllBtn">Tất cả 4 NXB <span class="mono" id="scopeAllCount">(0)</span></button>
        </div>

        <div class="chip-row" id="newsPubChips">
          <button class="chip active" data-pub="Tất cả">4 NXB</button>
          <button class="chip" data-pub="Trẻ">Trẻ</button>
          <button class="chip" data-pub="Kim Đồng">Kim Đồng</button>
          <button class="chip" data-pub="IPM">IPM</button>
          <button class="chip" data-pub="Nhã Nam">Nhã Nam</button>
        </div>

        <div class="chip-row" id="newsTypeChips">
          <button class="chip active" data-type="Tất cả">Tất cả tin</button>
          <button class="chip" data-type="new">Truyện mới</button>
          <button class="chip" data-type="reprint">Tái bản</button>
          <button class="chip" data-type="gift">Quà / Bản ĐB</button>
          <button class="chip" data-type="fes">Fes / Sự kiện</button>
        </div>

        <div class="chip-row" id="newsChanChips">

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "tusach_app_v2";
      const IDB_MIGRATED_FLAG = "tusach_idb_migrated_v1";
      const TEXT_SHADOW_KEY = "tusach_text_shadow_v1";

      const DEFAULT_STATE = {
        theme: "light",
        bookView: "grid",
        volView: "cards", // "cards" | "compact"
        budgetLimit: 1000000,
        newsUrl: "./news.json",
        lastBackupAt: "",
        lastEntry: {
          publisher: "Kim Đồng",
          category: "Manga",
          sectionName: "Bản thường",
          coverPrice: 35000,
          discount: 15,
        },
        series: [],     // { id, title, publisher, category, status, aliases, note, cover, createdAt, sections: [{ id, name, note, volumes: [...] }] }
        giftGroups: [], // { id, title, publisher, cover, note, createdAt, gifts: [{ id, name, quantity, price, source, status, date, image, note }] }
        pinned: [],     // { id, title, publisher, type, channel, releaseDate, estPrice, gift, url, manual }
        images: {},     // Kho ảnh chống trùng lặp: { hashId: "data:image/jpeg;base64,..." }
      };

      // ============================
      // BỘ LƯU TRỮ INDEXEDDB CHỐNG MẤT DỮ LIỆU CHO IPHONE
      // - Chống ghi đè khi app đang load (appReady lock)
      // - Tự nối lại khi iOS ngắt kết nối IDB nền (auto-retry)
      // - Không bao giờ tự đọc lại localStorage cũ ghi đè IDB
      // - Lưu kèm 1 bản text-only (<100KB) dự phòng khẩn cấp
      // ============================
      const IDB_NAME = "tusach_db_v1";
      const IDB_STORE = "kv";
      let idbInstance = null;
      let storageEngine = "IndexedDB";
      let appReady = false;
      let pendingSaves = 0;
      let saveChain = Promise.resolve();
      let lastSaveErrorShown = 0;

      function setSaveStatus(status, text) {
        const el = document.getElementById("saveIndicator");
        if (!el) return;
        el.textContent = text || "";
        el.className = "save-status mono" + (status ? " " + status : "");
      }

      function resetIDBHandle() {
        if (idbInstance) {
          try { idbInstance.close(); } catch {}
        }
        idbInstance = null;
      }

      function openIDB() {
        if (idbInstance) return Promise.resolve(idbInstance);
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("Trình duyệt không hỗ trợ IndexedDB"));
            return;
          }
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => {
            idbInstance = req.result;
            idbInstance.onclose = () => { idbInstance = null; };
            idbInstance.onversionchange = () => { resetIDBHandle(); };
            resolve(idbInstance);
          };
          req.onerror = () => reject(req.error || new Error("Lỗi mở IndexedDB"));
          req.onblocked = () => reject(new Error("IndexedDB đang bị tab khác khoá"));
        });
      }

      async function idbGet(key) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const db = await openIDB();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction(IDB_STORE, "readonly");
              const req = tx.objectStore(IDB_STORE).get(key);
              req.onsuccess = () => resolve(req.result ?? null);
              req.onerror = () => reject(req.error);
              tx.onabort = () => reject(tx.error || new Error("IDB read abort"));
            });
          } catch (err) {
            resetIDBHandle();
            if (attempt === 1) throw err;
          }
        }
        return null;
      }

      async function idbSet(key, val) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const db = await openIDB();
            return await new Promise((resolve, reject) => {
              const tx = db.transaction(IDB_STORE, "readwrite");
              tx.objectStore(IDB_STORE).put(val, key);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => reject(tx.error || new Error("Lỗi ghi IndexedDB"));
              tx.onabort = () => reject(tx.error || new Error("Giao dịch IndexedDB bị huỷ"));
            });
          } catch (err) {
            resetIDBHandle();
            if (attempt === 1) throw err;
          }
        }
        return false;
      }

      function hashStringFast(str) {
        let h1 = 0xdeadbeef ^ str.length;
        let h2 = 0x41c6ce57 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          const ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36) + "_" + str.length.toString(36);
      }

      function resolveImg(ref) {
        if (!ref) return "";
        if (typeof ref === "string" && ref.startsWith("img:")) {
          return (state.images && state.images[ref.slice(4)]) || "";
        }
        return ref;
      }

      function compactImagesInState(obj) {
        if (!obj || typeof obj !== "object") return;
        const oldPool = obj.images && typeof obj.images === "object" ? obj.images : {};
        const nextPool = {};

        const packRef = (val) => {
          if (!val || typeof val !== "string") return "";
          if (val.startsWith("img:")) {
            const key = val.slice(4);
            if (oldPool[key]) {
              nextPool[key] = oldPool[key];
              return val;
            }
            return "";
          }
          if (val.startsWith("data:image/")) {
            const key = hashStringFast(val);
            nextPool[key] = val;
            return "img:" + key;
          }
          return val;
        };

        (obj.series || []).forEach((s) => {
          s.cover = packRef(s.cover);
          (s.sections || []).forEach((sec) => {
            sec.image = packRef(sec.image);
            (sec.volumes || []).forEach((v) => {
              v.image = packRef(v.image);
            });
          });
        });

        (obj.giftGroups || []).forEach((g) => {
          g.cover = packRef(g.cover);
          (g.gifts || []).forEach((it) => {
            it.image = packRef(it.image);
          });
        });

        obj.images = nextPool;
      }

      // Tạo bản sao chỉ gồm chữ & số (bỏ ảnh) siêu nhẹ để cất dự phòng khẩn cấp vào localStorage
      function writeTextOnlyShadow(snapshot) {
        try {
          const shadow = {
            ...snapshot,
            images: {},
            series: (snapshot.series || []).map((s) => ({
              ...s,
              cover: "",
              sections: (s.sections || []).map((sec) => ({
                ...sec,
                image: "",
                volumes: (sec.volumes || []).map((v) => ({ ...v, image: "" })),
              })),
            })),
            giftGroups: (snapshot.giftGroups || []).map((g) => ({
              ...g,
              cover: "",
              gifts: (g.gifts || []).map((it) => ({ ...it, image: "" })),
            })),
            shadowSavedAt: new Date().toISOString(),
          };
          localStorage.setItem(TEXT_SHADOW_KEY, JSON.stringify(shadow));
        } catch {}
      }

      function readTextOnlyShadow() {
        try {
          const raw = localStorage.getItem(TEXT_SHADOW_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }

      function estimateStateBytes(obj) {
        try {
          return new Blob([JSON.stringify(obj)]).size;
        } catch {
          return JSON.stringify(obj).length;
        }
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      function migrateStateData(rawObj) {
        const merged = {
          ...structuredClone(DEFAULT_STATE),
          ...(rawObj || {}),
          series: Array.isArray(rawObj?.series) ? rawObj.series : [],
          giftGroups: Array.isArray(rawObj?.giftGroups) ? rawObj.giftGroups : [],
          pinned: Array.isArray(rawObj?.pinned) ? rawObj.pinned : [],
          images: rawObj?.images && typeof rawObj.images === "object" ? { ...rawObj.images } : {},
          lastEntry: { ...DEFAULT_STATE.lastEntry, ...(rawObj?.lastEntry || {}) },
        };

        const edNameMap = {
          "Thường": "Manga — Bản thường",
          "ĐB / Limited": "Limited",
          "Tái bản": "Tái bản",
          "Boxset": "Boxset",
        };
        merged.series = merged.series.map((s) => {
          const copy = { ...s };
          if (!Array.isArray(copy.sections)) {
            const legacyVols = Array.isArray(copy.volumes) ? copy.volumes : [];
            const byEd = new Map();
            legacyVols.forEach((v) => {
              const secName = edNameMap[v.edition] || v.edition || "Bản thường";
              if (!byEd.has(secName)) byEd.set(secName, []);
              byEd.get(secName).push({
                id: v.id || uid(),
                number: Number(v.number) || 1,
                coverPrice: Math.max(0, Number(v.coverPrice) || 0),
                paidPrice: Math.max(0, Number(v.paidPrice) || 0),
                date: v.date || todayISO(),
                image: v.image || "",
                readState: v.readState || "Chưa đọc",
                lentTo: v.lentTo || "",
                note: v.note || "",
                groupId: v.boxsetId || v.groupId || "",
                groupLabel: v.boxsetLabel || v.groupLabel || "",
              });
            });
            copy.sections = [...byEd.entries()].map(([name, vols]) => ({
              id: uid(),
              name,
              image: "",
              note: "",
              volumes: vols,
            }));
          } else {
            copy.sections = copy.sections.map((sec) => ({
              id: sec.id || uid(),
              name: sec.name || "Mục chưa đặt tên",
              image: sec.image || "",
              note: sec.note || "",
              volumes: Array.isArray(sec.volumes)
                ? sec.volumes.map((v) => ({
                    id: v.id || uid(),
                    number: Number(v.number) || 1,
                    coverPrice: Math.max(0, Number(v.coverPrice) || 0),
                    paidPrice: Math.max(0, Number(v.paidPrice) || 0),
                    date: v.date || todayISO(),
                    image: v.image || "",
                    readState: v.readState || "Chưa đọc",
                    lentTo: v.lentTo || "",
                    note: v.note || "",
                    groupId: v.groupId || v.boxsetId || "",
                    groupLabel: v.groupLabel || v.boxsetLabel || "",
                  }))
                : [],
            }));
          }
          delete copy.volumes;
          return copy;
        });

        if (Array.isArray(rawObj?.merch) && rawObj.merch.length > 0 && merged.giftGroups.length === 0) {
          const byBook = new Map();
          rawObj.merch.forEach((m) => {
            const bookTitle = (m.seriesName || "").trim() || "Quà lẻ / Chưa gắn bộ";
            if (!byBook.has(bookTitle)) {
              const matchedS = merged.series.find((s) => normVN(s.title) === normVN(bookTitle));
              byBook.set(bookTitle, {
                id: uid(),
                title: bookTitle,
                publisher: m.publisher || matchedS?.publisher || "Khác",
                cover: matchedS?.cover || "",
                note: "",
                createdAt: m.date || todayISO(),
                gifts: [],
              });
            }
            byBook.get(bookTitle).gifts.push({
              id: m.id || uid(),
              name: m.name || "Quà tặng",
              quantity: Math.max(1, Number(m.quantity) || 1),
              price: Math.max(0, Number(m.price) || 0),
              source: m.source || "Kèm bản ĐB",
              status: m.status || "Đã có",
              date: m.date || todayISO(),
              image: m.image || "",
              note: m.note || "",
            });
          });
          merged.giftGroups = [...byBook.values()];
        } else {
          merged.giftGroups = merged.giftGroups.map((g) => ({
            id: g.id || uid(),
            title: g.title || "Chưa đặt tên",
            publisher: g.publisher || "Khác",
            cover: g.cover || "",
            note: g.note || "",
            createdAt: g.createdAt || todayISO(),
            gifts: Array.isArray(g.gifts)
              ? g.gifts.map((it) => ({
                  id: it.id || uid(),
                  name: it.name || "Quà tặng",
                  quantity: Math.max(1, Number(it.quantity) || 1),
                  price: Math.max(0, Number(it.price) || 0),
                  source: it.source || "Kèm bản ĐB",
                  status: it.status || "Đã có",
                  date: it.date || todayISO(),
                  image: it.image || "",
                  note: it.note || "",
                }))
              : [],
          }));
        }
        delete merged.merch;
        return merged;
      }

      function getAllSeriesVolumes(s) {
        return (s.sections || []).flatMap((sec) => sec.volumes || []);
      }

      function isBookItem(s) {
        return s.category === "Sách";
      }

      function getGroupGiftStats(g) {
        const gifts = g.gifts || [];
        let qty = 0;
        let spent = 0;
        let owned = 0;
        let shipping = 0;
        let hunting = 0;
        gifts.forEach((it) => {
          const q = Math.max(1, Number(it.quantity) || 1);
          qty += q;
          spent += Math.max(0, Number(it.price) || 0);
          if (it.status === "Đã có") owned += q;
          else if (it.status === "Đang ship") shipping += q;
          else if (it.status === "Đang săn") hunting += q;
        });
        return { itemCount: gifts.length, qty, spent, owned, shipping, hunting };
      }

      function todayISO() {
        const d = new Date();
        const pad = (x) => String(x).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function normVN(str) {
        return (str || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      let state = structuredClone(DEFAULT_STATE);
      let newsItems = [];
      let newsMeta = { updatedAt: "", loaded: false, error: "" };

      const filters = {
        bookGroup: "all", // "all" | "truyen" | "sach"
        bookSearch: "",
        bookCat: "Tất cả",
        bookPub: "Tất cả",
        bookSort: "recent", // "recent" | "name" | "vols" | "spent"
        merchSearch: "",
        merchPub: "Tất cả",
        newsPub: "Tất cả",
        newsType: "Tất cả",
        newsChan: "Tất cả",
        newsScope: "shelf",
      };

      function loadFromLocalStorageLegacy() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      async function loadStateAsync() {
        let loadedRaw = null;
        let idbWorked = false;
        let alreadyMigrated = false;
        try {
          alreadyMigrated = localStorage.getItem(IDB_MIGRATED_FLAG) === "1";
        } catch {}

        try {
          loadedRaw = await idbGet(STORAGE_KEY);
          idbWorked = true;
          storageEngine = "IndexedDB";
        } catch (e) {
          idbWorked = false;
          storageEngine = "localStorage";
        }

        // CHỐNG MẤT DỮ LIỆU: Nếu trước đây đã chuyển sang IndexedDB mà nay IDB bị lỗi tạm thời,
        // KHÔNG ĐƯỢC tự nạp bản localStorage cũ lên đè! Báo lỗi & cho bấm tải lại.
        if (!idbWorked && alreadyMigrated) {
          setSaveStatus("error", "Lỗi đọc kho");
          alert(
            "Trình duyệt iPhone đang tạm khoá kho IndexedDB. App tạm dừng ghi để bảo vệ dữ liệu của bạn — hãy tắt hẳn app rồi mở lại!"
          );
          return false;
        }

        let cameFromLegacy = false;
        if (!loadedRaw) {
          const legacy = loadFromLocalStorageLegacy();
          if (legacy) {
            loadedRaw = legacy;
            cameFromLegacy = true;
          }
        }

        const migrated = loadedRaw ? migrateStateData(loadedRaw) : structuredClone(DEFAULT_STATE);
        compactImagesInState(migrated);
        state = migrated;

        if (idbWorked && (cameFromLegacy || loadedRaw)) {
          try {
            await idbSet(STORAGE_KEY, state);
            localStorage.setItem(IDB_MIGRATED_FLAG, "1");
            writeTextOnlyShadow(state);
            // Xoá bản localStorage cũ chứa ảnh nặng để tránh đọc nhầm về sau
            if (cameFromLegacy) {
              try { localStorage.removeItem(STORAGE_KEY); } catch {}
            }
          } catch {}
        }

        if (navigator.storage && typeof navigator.storage.persist === "function") {
          navigator.storage.persist().catch(() => {});
        }
        appReady = true;
        setSaveStatus("", "Đã lưu");
        return true;
      }

      function saveState() {
        // Không bao giờ cho phép ghi đè trước khi loadStateAsync() đọc xong dữ liệu cũ
        if (!appReady) return;
        compactImagesInState(state);
        updateHeaderSummary();

        const snapshot = structuredClone(state);
        pendingSaves++;
        setSaveStatus("saving", "Đang lưu...");

        saveChain = saveChain.then(async () => {
          try {
            await idbSet(STORAGE_KEY, snapshot);
            storageEngine = "IndexedDB";
            try { localStorage.setItem(IDB_MIGRATED_FLAG, "1"); } catch {}
            writeTextOnlyShadow(snapshot);
          } catch (idbErr) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
              storageEngine = "localStorage";
            } catch (lsErr) {
              setSaveStatus("error", "Lỗi lưu!");
              const now = Date.now();
              if (now - lastSaveErrorShown > 4000) {
                lastSaveErrorShown = now;
                alert(
                  "CẢNH BÁO: Chưa lưu được vào bộ nhớ máy (" +
                    (idbErr?.message || lsErr?.message || "QuotaExceeded") +
                    "). Vào Cài đặt -> Xuất file sao lưu ngay trước khi thoát app!"
                );
              }
              pendingSaves = Math.max(0, pendingSaves - 1);
              return;
            }
          }
          pendingSaves = Math.max(0, pendingSaves - 1);
          if (pendingSaves === 0) {
            setSaveStatus("", "Đã lưu");
          }
        });
      }

      // Tự reset kết nối IDB cũ khi người dùng quay lại app sau khi ẩn nền trên iPhone

      // Nén ảnh chọn từ máy (iPhone/Laptop) để lưu nhẹ trong localStorage
      function compressImageFile(file, maxW = 320, maxH = 480, quality = 0.74) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              const ratio = Math.min(maxW / w, maxH / h, 1);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // Chia tổng tiền Boxset đều cho nhiều tập sao cho tổng đúng từng đồng
      function splitTotalExact(total, count) {
        const cleanTotal = Math.max(0, Math.round(Number(total) || 0));
        const base = Math.floor(cleanTotal / count);
        const rem = cleanTotal - base * count;
        return Array.from({ length: count }, (_, idx) => base + (idx < rem ? 1 : 0));
      }

      function addBatchVolumesToSection(section, { from, to, priceMode, coverInput, paidInput, discount, date, image, note }) {
        const f = Math.round(Number(from));
        const t = Math.round(Number(to));
        const count = t - f + 1;
        let coverParts = [];
        let paidParts = [];
        if (priceMode === "total") {
          coverParts = splitTotalExact(coverInput, count);
          paidParts = splitTotalExact(paidInput, count);
        } else {
          const cp = Math.max(0, Math.round(Number(coverInput) || 0));
          const disc = Math.min(100, Math.max(0, Number(discount) || 0));
          const paid = Math.round(cp * (1 - disc / 100));
          coverParts = Array(count).fill(cp);
          paidParts = Array(count).fill(paid);
        }
        const groupId = count > 1 ? "grp_" + uid() : "";
        const groupLabel = count > 1 ? `Đợt tập ${f}–${t}` : "";
        section.volumes = section.volumes || [];
        for (let i = 0; i < count; i++) {
          section.volumes.push({
            id: uid(),
            number: f + i,
            coverPrice: coverParts[i],
            paidPrice: paidParts[i],
            date: date || todayISO(),
            image: image || "",
            note: note || "",
            groupId,
            groupLabel,
          });
        }
        return count;
      }

      // Helper đọc từng dòng khi Nhập nhanh nhiều bộ từ danh sách
      // Hỗ trợ linh hoạt:
      //   "Chainsaw Man"
      //   "Chainsaw Man - 16 tập" / "Chainsaw Man (1-16)"
      //   "Chainsaw Man | 1-16 | 45000"
      //   "Chainsaw Man | Kim Đồng | 1-16 | 45000 | 15"
      function parseBatchSeriesLines(rawText, defaults) {
        const lines = (rawText || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const pubMap = {
          tre: "Trẻ",
          "nxb tre": "Trẻ",
          kim: "Kim Đồng",
          "kim dong": "Kim Đồng",
          "nxb kim dong": "Kim Đồng",
          ipm: "IPM",
          "nha nam": "Nhã Nam",
          nn: "Nhã Nam",
        };
        const parsePub = (str) => {
          const k = normVN(str);
          return pubMap[k] || null;
        };
        const parseRange = (str) => {
          const s = (str || "").trim();
          let m = s.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
          if (m) return { from: Math.max(1, Number(m[1])), to: Math.max(1, Number(m[2])) };
          m = s.match(/^(\d+)\s*(?:tập|tap|q|quyển|quyen|vol)?$/i);
          if (m && Number(m[1]) >= 1 && Number(m[1]) <= 300) {
            return { from: 1, to: Number(m[1]) };
          }
          return null;
        };

        const parsed = [];
        for (const line of lines) {
          let title = line;
          let publisher = defaults.publisher;
          let from = defaults.defaultFrom;
          let to = defaults.defaultTo;
          let coverPrice = defaults.coverPrice;
          let discount = defaults.discount;

          if (line.includes("|")) {
            const parts = line.split("|").map((p) => p.trim()).filter(Boolean);
            title = parts[0] || "";
            for (let i = 1; i < parts.length; i++) {
              const p = parts[i];
              const maybePub = parsePub(p);
              if (maybePub) {
                publisher = maybePub;
                continue;
              }
              if (/^\d{1,2}\s*%$/.test(p)) {
                discount = Math.min(100, Math.max(0, Number(p.replace("%", "").trim())));
                continue;
              }
              const rng = parseRange(p);
              if (rng && (p.includes("-") || p.includes("–") || /tập|tap|q|vol/i.test(p) || Number(p) <= 300)) {
                if (Number(p) <= 300 && i >= 3 && from && to) {
                  // Nếu đã có range trước đó và số nhỏ <= 100 ở cuối -> hiểu là % chiết khấu
                  if (Number(p) <= 100) {
                    discount = Number(p);
                    continue;
                  }
                }
                from = rng.from;
                to = Math.max(rng.from, rng.to);
                continue;
              }
              const digits = Number(p.replace(/[^\d]/g, ""));
              if (digits >= 1000) {
                coverPrice = digits;
              } else if (digits > 0 && digits <= 100 && p.match(/^\d+$/)) {
                discount = digits;
              }
            }
          } else {
            // Cú pháp tự nhiên không cần dấu |:
            // "Chainsaw Man (1-16)", "Chainsaw Man - 16 tập", "Chainsaw Man 1-16"
            let m = line.match(/^(.*?)\s*[\(\[]\s*(\d+)\s*[-–~]\s*(\d+)\s*[\)\]]\s*$/);
            if (m) {
              title = m[1].trim();
              from = Math.max(1, Number(m[2]));
              to = Math.max(from, Number(m[3]));
            } else {
              m = line.match(/^(.*?)\s*[-–:,]?\s*(\d+)\s*[-–~]\s*(\d+)\s*(?:tập|tap|vol)?$/i);
              if (m && m[1].trim().length >= 2) {
                title = m[1].trim();
                from = Math.max(1, Number(m[2]));
                to = Math.max(from, Number(m[3]));
              } else {
                m = line.match(/^(.*?)\s*[-–:,(\s]+(\d+)\s*(?:tập|tap|quyển|quyen)\)?$/i);
                if (m && m[1].trim().length >= 2) {
                  title = m[1].trim();
                  from = 1;
                  to = Math.max(1, Number(m[2]));
                }
              }
            }
          }

          if (!title) continue;
          const volCount = from && to && to >= from ? Math.min(150, to - from + 1) : 0;
          const paidPerVol = Math.round(coverPrice * (1 - discount / 100));
          parsed.push({
            title,
            publisher,
            from: volCount ? from : 0,
            to: volCount ? from + volCount - 1 : 0,
            volCount,
            coverPrice,
            discount,
            paidPerVol,
            totalPaid: paidPerVol * volCount,
          });
        }
        return parsed;
      }
