<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tủ Sách" />
  <meta name="theme-color" content="#F6F5F1" id="metaThemeColor" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>Tủ Sách — Manga, Sách & Quà</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F5F1;
      --surface: #FFFFFF;
      --surface-2: #EFECE4;
      --ink: #1C1B19;
      --muted: #6E6A63;
      --line: #DCD8CE;
      --line-strong: #B9B3A6;
      --accent: #9E472A;
      --accent-soft: #F5E8E3;
      --forest: #2F5D50;
      --forest-soft: #E5EFEA;
      --amber: #8F6424;
      --amber-soft: #F4ECDF;
      --danger: #A63229;
      --pub-tre: #A83A2F;
      --pub-kim: #2E5278;
      --pub-ipm: #2F5D50;
      --pub-nn: #8F6424;
      --pub-other: #5E5B55;
      --radius: 2px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="dark"] {
      --bg: #141312;
      --surface: #1C1A18;
      --surface-2: #25221F;
      --ink: #EDEAE3;
      --muted: #989288;
      --line: #2F2C28;
      --line-strong: #49443D;
      --accent: #CE6E4E;
      --accent-soft: #2D1E19;
      --forest: #62A08D;
      --forest-soft: #1B2A25;
      --amber: #CCA05C;
      --amber-soft: #2A2318;
      --danger: #D86259;
      --pub-tre: #CE6459;
      --pub-kim: #6994C2;
      --pub-ipm: #62A08D;
      --pub-nn: #CCA05C;
      --pub-other: #8A847A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      overscroll-behavior-y: none;
    }

    .mono {
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
      font-variant-numeric: tabular-nums;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      font-size: 16px; /* Prevent iOS Safari auto-zoom */
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Layout Shell */
    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(68px + var(--safe-bottom));
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + var(--safe-top)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand-meta {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      height: 32px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn:active {
      background: var(--surface-2);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    /* Main Content */
    .main {
      padding: 14px 16px 24px;
      flex: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* Toolbar & Filters */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--ink);
    }

    .btn {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:active {
      background: var(--surface-2);
    }

    .btn-primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-accent {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
      background: transparent;
    }

    .btn-sm {
      height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }

    .chip-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .chip.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .chip.accent-active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    /* Section header row */
    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .seg button {
      height: 26px;
      padding: 0 9px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface);
      color: var(--muted);
    }

    .seg button + button {
      border-left: 1px solid var(--line);
    }

    .seg button.active {
      background: var(--ink);
      color: var(--bg);
    }

    /* Books Grid */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 10px;
    }

    @media (min-width: 640px) {
      .book-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px 14px;
      }
    }

    @media (min-width: 840px) {
      .book-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }

    .book-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .book-cover {
      position: relative;
      aspect-ratio: 2 / 3;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .typo-cover {
      padding: 10px 9px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 3px solid var(--pub-other);
    }

    .typo-pub {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .typo-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .typo-cat {
      font-size: 10px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 6px;
    }

    .cover-badge {
      position: absolute;
      bottom: 5px;
      right: 5px;
      background: rgba(20, 19, 18, 0.84);
      color: #F6F5F1;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 1px;
    }

    .book-info {
      padding-top: 6px;
    }

    .book-name {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-meta {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    /* Books List */
    .book-list {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .book-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .book-row:last-child {
      border-bottom: none;
    }

    .book-row:active {
      background: var(--surface-2);
    }

    .row-thumb {
      width: 38px;
      height: 54px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
    }

    .row-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tags & Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 1px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface-2);
      white-space: nowrap;
    }

    .tag-accent {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .tag-forest {
      border-color: var(--forest);
      color: var(--forest);
      background: var(--forest-soft);
    }

    .tag-amber {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-soft);
    }

    /* Volume Matrix */
    .vol-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 6px;
      margin: 12px 0;
    }

    .vol-cell {
      position: relative;
      height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
    }

    .vol-cell:active {
      background: var(--surface-2);
    }

    .vol-cell .vol-sub {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1;
      margin-top: 2px;
    }

    .vol-cell.ed-special::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      border-top: 9px solid var(--accent);
      border-left: 9px solid transparent;
    }

    .vol-cell.ed-reprint::after {
      content: "";
      position: absolute;
      top: 4px;
      right: 4px;
      width: 5px;
      height: 5px;
      background: var(--forest);
    }

    .vol-cell.ed-boxset {
      border-color: var(--ink);
      border-width: 1.5px;
    }

    /* Merch Cards */
    .merch-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .merch-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .merch-main {
      min-width: 0;
      flex: 1;
    }

    .merch-title {
      font-size: 13.5px;
      font-weight: 600;
    }

    .merch-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .merch-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
      align-items: center;
    }

    .merch-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-cycle {
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 600;
      background: var(--surface-2);
    }

    .status-cycle[data-status="Đã có"] {
      border-color: var(--forest);
      color: var(--forest);
      background: var(--forest-soft);
    }

    .status-cycle[data-status="Đang ship"] {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-soft);
    }

    .status-cycle[data-status="Đang săn"] {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* News Feed */
    .news-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 10px;
      font-size: 12px;
    }

    .scope-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .scope-switch button {
      height: 34px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .scope-switch button + button {
      border-left: 1px solid var(--line);
    }

    .scope-switch button.active {
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .news-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .news-card.matched {
      border-left: 3px solid var(--accent);
    }

    .news-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }

    .news-body {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .news-text {
      flex: 1;
      min-width: 0;
    }

    .news-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 5px;
    }

    .news-summary {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0;
      line-height: 1.45;
    }

    .news-thumb {
      width: 62px;
      height: 82px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      object-fit: cover;
      flex-shrink: 0;
    }

    .news-gift {
      margin-top: 8px;
      padding: 6px 8px;
      border-left: 2px solid var(--amber);
      background: var(--amber-soft);
      font-size: 12px;
    }

    .news-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
    }

    /* Spending Dashboard */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px 12px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-val {
      font-size: 17px;
      font-weight: 600;
      margin-top: 4px;
    }

    .kpi-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 8px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--ink);
      transition: width 0.2s ease;
    }

    .progress-fill.over {
      background: var(--danger);
    }

    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 84px 1fr 78px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .bar-track {
      height: 10px;
      background: var(--surface-2);
    }

    .bar-fill {
      height: 100%;
      background: var(--ink);
    }

    .bar-val {
      text-align: right;
      font-size: 11.5px;
      color: var(--muted);
    }

    /* Empty State */
    .empty {
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
    }

    .empty-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 5px;
    }

    .empty-desc {
      font-size: 12.5px;
      max-width: 380px;
      margin: 0 auto 14px;
    }

    /* Bottom Tab Bar */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding-bottom: var(--safe-bottom);
    }

    .tabbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      height: 54px;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      position: relative;
    }

    .tab-btn.active {
      color: var(--ink);
      font-weight: 600;
    }

    .tab-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 2px;
      background: var(--accent);
    }

    .tab-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
    }

    .tab-dot {
      position: absolute;
      top: 7px;
      right: calc(50% - 14px);
      width: 6px;
      height: 6px;
      background: var(--accent);
      display: none;
    }

    .tab-dot.show {
      display: block;
    }

    /* Modal / Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 14, 12, 0.52);
      display: none;
      align-items: flex-end;
      justify-content: center;

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "tusach_app_v2";
      const DEFAULT_STATE = {
        theme: "light",
        bookView: "grid",
        budgetLimit: 1000000,
        newsUrl: "./news.json",
        series: [],     // { id, title, publisher, category, status, aliases, note, cover, createdAt, sections: [{ id, name, note, volumes: [...] }] }
        giftGroups: [], // { id, title, publisher, cover, note, createdAt, gifts: [{ id, name, quantity, price, source, status, date, image, note }] }
        pinned: [],     // { id, title, publisher, type, channel, releaseDate, estPrice, gift, url, manual }
        images: {},     // Kho ảnh chống trùng lặp: { hashId: "data:image/jpeg;base64,..." }
      };

      // ============================
      // BỘ LƯU TRỮ INDEXEDDB (CHỐNG TRÀN 5MB TRÊN IPHONE) + CHỐNG TRÙNG ẢNH
      // ============================
      const IDB_NAME = "tusach_db_v1";
      const IDB_STORE = "kv";
      let idbInstance = null;
      let storageEngine = "IndexedDB";
      let saveChain = Promise.resolve();
      let lastSaveErrorShown = 0;

      function openIDB() {
        if (idbInstance) return Promise.resolve(idbInstance);
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("Trình duyệt không hỗ trợ IndexedDB"));
            return;
          }
          const req = indexedDB.open(IDB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
          };
          req.onsuccess = () => {
            idbInstance = req.result;
            idbInstance.onclose = () => { idbInstance = null; };
            resolve(idbInstance);
          };
          req.onerror = () => reject(req.error || new Error("Lỗi mở IndexedDB"));
        });
      }

      async function idbGet(key) {
        const db = await openIDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, "readonly");
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      }

      async function idbSet(key, val) {
        const db = await openIDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).put(val, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error || new Error("Lỗi ghi IndexedDB"));
          tx.onabort = () => reject(tx.error || new Error("Giao dịch IndexedDB bị huỷ"));
        });
      }

      function hashStringFast(str) {
        let h1 = 0xdeadbeef ^ str.length;
        let h2 = 0x41c6ce57 ^ str.length;
        for (let i = 0; i < str.length; i++) {
          const ch = str.charCodeAt(i);
          h1 = Math.imul(h1 ^ ch, 2654435761);
          h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36) + "_" + str.length.toString(36);
      }

      function resolveImg(ref) {
        if (!ref) return "";
        if (typeof ref === "string" && ref.startsWith("img:")) {
          return (state.images && state.images[ref.slice(4)]) || "";
        }
        return ref;
      }

      function compactImagesInState(obj) {
        if (!obj || typeof obj !== "object") return;
        const oldPool = obj.images && typeof obj.images === "object" ? obj.images : {};
        const nextPool = {};

        const packRef = (val) => {
          if (!val || typeof val !== "string") return "";
          if (val.startsWith("img:")) {
            const key = val.slice(4);
            if (oldPool[key]) {
              nextPool[key] = oldPool[key];
              return val;
            }
            return "";
          }
          if (val.startsWith("data:image/")) {
            const key = hashStringFast(val);
            nextPool[key] = val;
            return "img:" + key;
          }
          return val;
        };

        (obj.series || []).forEach((s) => {
          s.cover = packRef(s.cover);
          (s.sections || []).forEach((sec) => {
            (sec.volumes || []).forEach((v) => {
              v.image = packRef(v.image);
            });
          });
        });

        (obj.giftGroups || []).forEach((g) => {
          g.cover = packRef(g.cover);
          (g.gifts || []).forEach((it) => {
            it.image = packRef(it.image);
          });
        });

        obj.images = nextPool;
      }

      function estimateStateBytes(obj) {
        try {
          return new Blob([JSON.stringify(obj)]).size;
        } catch {
          return JSON.stringify(obj).length;
        }
      }

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }

      function migrateStateData(rawObj) {
        const merged = {
          ...structuredClone(DEFAULT_STATE),
          ...(rawObj || {}),
          series: Array.isArray(rawObj?.series) ? rawObj.series : [],
          giftGroups: Array.isArray(rawObj?.giftGroups) ? rawObj.giftGroups : [],
          pinned: Array.isArray(rawObj?.pinned) ? rawObj.pinned : [],
          images: rawObj?.images && typeof rawObj.images === "object" ? { ...rawObj.images } : {},
        };

        // 1. Migrate legacy series.volumes -> series.sections
        const edNameMap = {
          "Thường": "Manga — Bản thường",
          "ĐB / Limited": "Limited",
          "Tái bản": "Tái bản",
          "Boxset": "Boxset",
        };
        merged.series = merged.series.map((s) => {
          const copy = { ...s };
          if (!Array.isArray(copy.sections)) {
            const legacyVols = Array.isArray(copy.volumes) ? copy.volumes : [];
            const byEd = new Map();
            legacyVols.forEach((v) => {
              const secName = edNameMap[v.edition] || v.edition || "Bản thường";
              if (!byEd.has(secName)) byEd.set(secName, []);
              byEd.get(secName).push({
                id: v.id || uid(),
                number: Number(v.number) || 1,
                coverPrice: Math.max(0, Number(v.coverPrice) || 0),
                paidPrice: Math.max(0, Number(v.paidPrice) || 0),
                date: v.date || todayISO(),
                image: v.image || "",
                note: v.note || "",
                groupId: v.boxsetId || v.groupId || "",
                groupLabel: v.boxsetLabel || v.groupLabel || "",
              });
            });
            copy.sections = [...byEd.entries()].map(([name, vols]) => ({
              id: uid(),
              name,
              note: "",
              volumes: vols,
            }));
          } else {
            copy.sections = copy.sections.map((sec) => ({
              id: sec.id || uid(),
              name: sec.name || "Mục chưa đặt tên",
              note: sec.note || "",
              volumes: Array.isArray(sec.volumes)
                ? sec.volumes.map((v) => ({
                    id: v.id || uid(),
                    number: Number(v.number) || 1,
                    coverPrice: Math.max(0, Number(v.coverPrice) || 0),
                    paidPrice: Math.max(0, Number(v.paidPrice) || 0),
                    date: v.date || todayISO(),
                    image: v.image || "",
                    note: v.note || "",
                    groupId: v.groupId || v.boxsetId || "",
                    groupLabel: v.groupLabel || v.boxsetLabel || "",
                  }))
                : [],
            }));
          }
          delete copy.volumes;
          return copy;
        });

        // 2. Migrate legacy state.merch -> state.giftGroups
        if (Array.isArray(rawObj?.merch) && rawObj.merch.length > 0 && merged.giftGroups.length === 0) {
          const byBook = new Map();
          rawObj.merch.forEach((m) => {
            const bookTitle = (m.seriesName || "").trim() || "Quà lẻ / Chưa gắn bộ";
            if (!byBook.has(bookTitle)) {
              const matchedS = merged.series.find((s) => normVN(s.title) === normVN(bookTitle));
              byBook.set(bookTitle, {
                id: uid(),
                title: bookTitle,
                publisher: m.publisher || matchedS?.publisher || "Khác",
                cover: matchedS?.cover || "",
                note: "",
                createdAt: m.date || todayISO(),
                gifts: [],
              });
            }
            byBook.get(bookTitle).gifts.push({
              id: m.id || uid(),
              name: m.name || "Quà tặng",
              quantity: Math.max(1, Number(m.quantity) || 1),
              price: Math.max(0, Number(m.price) || 0),
              source: m.source || "Kèm bản ĐB",
              status: m.status || "Đã có",
              date: m.date || todayISO(),
              image: m.image || "",
              note: m.note || "",
            });
          });
          merged.giftGroups = [...byBook.values()];
        } else {
          merged.giftGroups = merged.giftGroups.map((g) => ({
            id: g.id || uid(),
            title: g.title || "Chưa đặt tên",
            publisher: g.publisher || "Khác",
            cover: g.cover || "",
            note: g.note || "",
            createdAt: g.createdAt || todayISO(),
            gifts: Array.isArray(g.gifts)
              ? g.gifts.map((it) => ({
                  id: it.id || uid(),
                  name: it.name || "Quà tặng",
                  quantity: Math.max(1, Number(it.quantity) || 1),
                  price: Math.max(0, Number(it.price) || 0),
                  source: it.source || "Kèm bản ĐB",
                  status: it.status || "Đã có",
                  date: it.date || todayISO(),
                  image: it.image || "",
                  note: it.note || "",
                }))
              : [],
          }));
        }
        delete merged.merch;
        return merged;
      }

      function getAllSeriesVolumes(s) {
        return (s.sections || []).flatMap((sec) => sec.volumes || []);
      }

      function getGroupGiftStats(g) {
        const gifts = g.gifts || [];
        let qty = 0;
        let spent = 0;
        let owned = 0;
        let shipping = 0;
        let hunting = 0;
        gifts.forEach((it) => {
          const q = Math.max(1, Number(it.quantity) || 1);
          qty += q;
          spent += Math.max(0, Number(it.price) || 0);
          if (it.status === "Đã có") owned += q;
          else if (it.status === "Đang ship") shipping += q;
          else if (it.status === "Đang săn") hunting += q;
        });
        return { itemCount: gifts.length, qty, spent, owned, shipping, hunting };
      }

      function todayISO() {
        const d = new Date();
        const pad = (x) => String(x).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }

      function normVN(str) {
        return (str || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/[^a-z0-9\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      let state = structuredClone(DEFAULT_STATE);
      let newsItems = [];
      let newsMeta = { updatedAt: "", loaded: false, error: "" };

      const filters = {
        bookSearch: "",
        bookCat: "Tất cả",
        bookPub: "Tất cả",
        merchSearch: "",
        merchPub: "Tất cả",
        newsPub: "Tất cả",
        newsType: "Tất cả",
        newsChan: "Tất cả",
        newsScope: "shelf", // Mặc định CHỈ hiện tin liên quan sách/truyện đang có trong tủ
      };

      function loadFromLocalStorageLegacy() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      async function loadStateAsync() {
        let loadedRaw = null;
        let cameFromLegacy = false;

        try {
          loadedRaw = await idbGet(STORAGE_KEY);
          storageEngine = "IndexedDB";
        } catch (e) {
          storageEngine = "localStorage";
        }

        // Nếu lần đầu nâng cấp lên IndexedDB -> tự kéo toàn bộ dữ liệu cũ từ localStorage sang (không mất 16 bộ cũ)
        if (!loadedRaw) {
          const legacy = loadFromLocalStorageLegacy();
          if (legacy) {
            loadedRaw = legacy;
            cameFromLegacy = true;
          }
        }

        const migrated = loadedRaw ? migrateStateData(loadedRaw) : structuredClone(DEFAULT_STATE);
        compactImagesInState(migrated);
        state = migrated;

        if (cameFromLegacy && storageEngine === "IndexedDB") {
          try {
            await idbSet(STORAGE_KEY, state);
          } catch {}
        }

        // Xin iOS cấp quyền lưu bền vững để không bị dọn cache
        if (navigator.storage && typeof navigator.storage.persist === "function") {
          navigator.storage.persist().catch(() => {});
        }
      }

      function saveState() {
        compactImagesInState(state);
        updateHeaderSummary();

        // Snapshot để lưu tuần tự vào IndexedDB (tránh ghi đè khi bấm nhanh liên tục)
        const snapshot = structuredClone(state);
        saveChain = saveChain.then(async () => {
          try {
            await idbSet(STORAGE_KEY, snapshot);
            storageEngine = "IndexedDB";
            // Nếu dữ liệu còn nhẹ (< 3.5MB), ghi dự phòng thêm vào localStorage; lớn hơn thì bỏ qua không báo lỗi
            try {
              const serialized = JSON.stringify(snapshot);
              if (serialized.length < 3500000) {
                localStorage.setItem(STORAGE_KEY, serialized);
              }
            } catch {}
          } catch (idbErr) {
            // Fallback sang localStorage nếu trình duyệt khoá IndexedDB
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
              storageEngine = "localStorage";
            } catch (lsErr) {
              const now = Date.now();
              if (now - lastSaveErrorShown > 4000) {
                lastSaveErrorShown = now;
                alert(
                  "CẢNH BÁO: Không lưu được dữ liệu mới vào bộ nhớ máy (" +
                    (idbErr?.message || lsErr?.message || "QuotaExceeded") +
                    "). Hãy vào Cài đặt -> Xuất file sao lưu ngay trước khi thoát app!"
                );
              }
            }
          }
        });
      }

      function fmtMoney(n) {
        const val = Math.round(Number(n) || 0);
        return val.toLocaleString("vi-VN") + "đ";
      }

      function esc(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function pubColorVar(pub) {
        if (pub === "Trẻ") return "var(--pub-tre)";
        if (pub === "Kim Đồng") return "var(--pub-kim)";
        if (pub === "IPM") return "var(--pub-ipm)";
        if (pub === "Nhã Nam") return "var(--pub-nn)";
        return "var(--pub-other)";
      }

      function typeLabel(t) {
        const map = { new: "Truyện mới", reprint: "Tái bản", gift: "Quà / ĐB", fes: "Fes" };
        return map[t] || "Tin mới";
      }

      function typeTagClass(t) {
        if (t === "reprint") return "tag-forest";
        if (t === "gift") return "tag-amber";
        if (t === "fes") return "tag-accent";
        return "";
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
      }

      // Theme
      function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.theme);
        document.getElementById("themeLabel").textContent = state.theme === "dark" ? "Giấy ấm" : "Đèn bàn";
        document.getElementById("metaThemeColor").setAttribute(
          "content",
          state.theme === "dark" ? "#141312" : "#F6F5F1"
        );
      }

      // Modal helpers
      const modalBackdrop = document.getElementById("modalBackdrop");
      const modalTitleEl = document.getElementById("modalTitle");
      const modalBodyEl = document.getElementById("modalBody");

      let currentModalCleanup = null;

      function openModal(title, html, onMount, onClose = null) {
        if (typeof currentModalCleanup === "function") {
          try { currentModalCleanup(); } catch {}
          currentModalCleanup = null;
        }
        modalTitleEl.textContent = title;
        modalBodyEl.innerHTML = html;
        modalBackdrop.classList.add("open");
        currentModalCleanup = typeof onClose === "function" ? onClose : null;
        if (typeof onMount === "function") onMount(modalBodyEl);
      }

      function closeModal() {
        if (typeof currentModalCleanup === "function") {
          try { currentModalCleanup(); } catch {}
          currentModalCleanup = null;
        }
        modalBackdrop.classList.remove("open");
      }

      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });

      // Header Summary
      function updateHeaderSummary() {
        const seriesCount = state.series.length;
        const volCount = state.series.reduce((sum, s) => sum + getAllSeriesVolumes(s).length, 0);
        document.getElementById("headerSummary").textContent = `${seriesCount} đầu sách · ${volCount} tập`;
      }

      // Nén ảnh chọn từ máy (iPhone/Laptop) để lưu nhẹ trong localStorage
      function compressImageFile(file, maxW = 320, maxH = 480, quality = 0.74) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              const ratio = Math.min(maxW / w, maxH / h, 1);
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // Chia tổng tiền Boxset đều cho nhiều tập sao cho tổng đúng từng đồng
      function splitTotalExact(total, count) {
        const cleanTotal = Math.max(0, Math.round(Number(total) || 0));
        const base = Math.floor(cleanTotal / count);
        const rem = cleanTotal - base * count;
        return Array.from({ length: count }, (_, idx) => base + (idx < rem ? 1 : 0));
      }

      function addBatchVolumesToSection(section, { from, to, priceMode, coverInput, paidInput, discount, date, image, note }) {
        const f = Math.round(Number(from));
        const t = Math.round(Number(to));
        const count = t - f + 1;
        let coverParts = [];
        let paidParts = [];
        if (priceMode === "total") {
          coverParts = splitTotalExact(coverInput, count);
          paidParts = splitTotalExact(paidInput, count);
        } else {
          const cp = Math.max(0, Math.round(Number(coverInput) || 0));
          const disc = Math.min(100, Math.max(0, Number(discount) || 0));
          const paid = Math.round(cp * (1 - disc / 100));
          coverParts = Array(count).fill(cp);
          paidParts = Array(count).fill(paid);
        }
        const groupId = count > 1 ? "grp_" + uid() : "";
        const groupLabel = count > 1 ? `Đợt tập ${f}–${t}` : "";
        section.volumes = section.volumes || [];
        for (let i = 0; i < count; i++) {
          section.volumes.push({
            id: uid(),
            number: f + i,
            coverPrice: coverParts[i],
            paidPrice: paidParts[i],
            date: date || todayISO(),
            image: image || "",
            note: note || "",
            groupId,
            groupLabel,
          });
        }
        return count;
      }

      // ============================
      // TAB 1: TỦ SÁCH (Đầu sách -> Các mục -> Tập + Ảnh + Giá)
      // ============================
      function renderBooks() {
        const container = document.getElementById("booksContainer");
        const q = normVN(filters.bookSearch);

        const list = state.series.filter((s) => {
          if (filters.bookCat !== "Tất cả" && s.category !== filters.bookCat) return false;
          if (filters.bookPub !== "Tất cả") {
            const known = ["Trẻ", "Kim Đồng", "IPM", "Nhã Nam"];
            if (filters.bookPub === "Khác") {
              if (known.includes(s.publisher)) return false;
            } else if (s.publisher !== filters.bookPub) {
              return false;
            }
          }
          if (q) {
            const secNames = (s.sections || []).map((sec) => sec.name).join(" ");
            const hay = normVN(`${s.title} ${s.publisher} ${s.category} ${s.aliases || ""} ${secNames} ${s.note || ""}`);
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const totalVols = list.reduce((a, s) => a + getAllSeriesVolumes(s).length, 0);
        document.getElementById("bookCountLabel").textContent = `${list.length} đầu sách · ${totalVols} tập`;

        if (!list.length) {
          container.innerHTML = `
            <div class="empty">
              <div class="empty-title">${state.series.length ? "Không tìm thấy đầu sách phù hợp" : "Tủ sách đang trống"}</div>
              <div class="empty-desc">${
                state.series.length
                  ? "Thử bỏ bớt bộ lọc hoặc đổi từ khoá tìm kiếm."
                  : "Bấm + Thêm bộ để tạo đầu manga hoặc sách, sau đó tạo các mục (bản thường, boxset, limit, tái bản...) bên trong."
              }</div>
              ${
                state.series.length
                  ? ""
                  : `<button class="btn btn-primary" id="emptyAddBookBtn">+ Thêm bộ đầu tiên</button>`
              }
            </div>`;
          const btn = document.getElementById("emptyAddBookBtn");
          if (btn) btn.addEventListener("click", () => openSeriesForm());
          return;
        }

        if (state.bookView === "grid") {
          container.innerHTML = `<div class="book-grid">${list
            .map((s) => {
              const vols = getAllSeriesVolumes(s);
              const secCount = (s.sections || []).length;
              const spent = vols.reduce((a, v) => a + (Number(v.paidPrice) || 0), 0);
              const coverSrc = resolveImg(s.cover);
              const coverHtml = coverSrc
                ? `<img src="${esc(coverSrc)}" alt="${esc(s.title)}" loading="lazy" referrerpolicy="no-referrer" />`
                : `<div class="typo-cover" style="border-left-color:${pubColorVar(s.publisher)}">
                     <div class="typo-pub mono">${esc(s.publisher)}</div>
                     <div class="typo-title">${esc(s.title)}</div>
                     <div class="typo-cat mono">${esc(s.category)}</div>
                   </div>`;
              return `
                <article class="book-card" data-id="${s.id}">
                  <div class="book-cover">
                    ${coverHtml}
                    <span class="cover-badge mono">${vols.length} tập</span>
                  </div>
                  <div class="book-info">
                    <div class="book-name">${esc(s.title)}</div>
                    <div class="book-meta">
                      <span>${secCount ? `${secCount} mục` : esc(s.publisher)}</span>
                      <span class="mono">${fmtMoney(spent)}</span>
                    </div>
                  </div>
                </article>`;
            })
            .join("")}</div>`;
        } else {
          container.innerHTML = `<div class="book-list">${list
            .map((s) => {
              const vols = getAllSeriesVolumes(s);
              const secCount = (s.sections || []).length;
              const spent = vols.reduce((a, v) => a + (Number(v.paidPrice) || 0), 0);
              return `
                <div class="book-row" data-id="${s.id}">
                  <div class="row-thumb" style="border-left:2px solid ${pubColorVar(s.publisher)}">
                    ${resolveImg(s.cover) ? `<img src="${esc(resolveImg(s.cover))}" alt="" referrerpolicy="no-referrer" />` : `<span class="mono">${esc(s.publisher.slice(0, 3))}</span>`}
                  </div>
                  <div style="min-width:0;">
                    <div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(s.title)}</div>
                    <div class="small-muted" style="margin-top:2px;">${esc(s.publisher)} · ${esc(s.category)} · ${secCount} mục · ${esc(s.status || "Đang theo")}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="mono" style="font-size:12.5px; font-weight:600;">${vols.length} tập</div>
                    <div class="mono small-muted">${fmtMoney(spent)}</div>
                  </div>
                </div>`;
            })
            .join("")}</div>`;
        }

        container.querySelectorAll("[data-id]").forEach((el) => {
          el.addEventListener("click", () => openSeriesDetail(el.dataset.id));
